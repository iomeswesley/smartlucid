/* ==========================================================================
   Flowline — tokens herdados do Teardown Platform (Precision Workspace)
   Um único conjunto de tokens semânticos. O tema escuro troca só os valores;
   nenhum componente deve ter override por classe (fim dos !important do css.html).
   Uso: html[data-theme="dark"] liga o modo escuro (o botão da lua só alterna o atributo).
   ========================================================================== */


:root {
  /* Tipografia */
  --font-ui: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace; /* todo número: custo, capacidade, PN, %, datas */
  --fs-12: 12px;  /* mínimo absoluto: cabeçalhos de coluna, legendas */
  --fs-13: 13px;  /* textos auxiliares, células densas */
  --fs-14: 14px;  /* padrão de UI e tabelas */
  --fs-16: 16px;  /* títulos de card */
  --fs-20: 20px;  /* títulos de seção / página */
  --fs-22: 22px;  /* título do registro (ex.: Midea RT533) */
  --fs-28: 28px;
  --fs-40: 40px;  /* número de destaque */

  /* Espaçamento (escala de 4) */
  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-20: 20px; --sp-24: 24px; --sp-32: 32px; --sp-48: 48px;

  /* Forma */
  --radius-control: 6px;   /* botões, inputs, selects, chips de delta */
  --radius-card: 10px;     /* cards, painéis */
  --radius-pill: 999px;    /* status */
  --control-h: 36px;       /* 44px em toque */
  --shadow-float: 0 8px 24px rgba(14, 23, 38, .12); /* só camadas flutuantes: menus, modais, ⌘K */

  /* Movimento */
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* ---------- Cores · tema claro (padrão) ---------- */
  --c-canvas: #F5F7FA;       /* fundo da página */
  --c-surface: #FFFFFF;      /* cards, header, tabelas */
  --c-surface-2: #FAFBFC;    /* cabeçalho de tabela, linhas de contexto */
  --c-surface-3: #F0F3F7;    /* linhas de subsistema / subtotal */
  --c-line: #E3E7EE;
  --c-line-soft: #EEF1F5;
  --c-line-strong: #CBD2DC;  /* bordas de input */

  --c-ink-900: #0E1726;      /* texto principal */
  --c-ink-700: #344054;      /* texto secundário, labels */
  --c-ink-500: #5B6577;      /* texto auxiliar (contraste ≥ 4.5:1 no branco) */

  --c-action: #2650E0;       /* único acento: ação primária, aba ativa, foco, seleção */
  --c-action-hover: #1E44C4;
  --c-action-soft: #E8EEFC;  /* fundo de item selecionado */
  --c-action-ink: #1E3FA8;   /* texto sobre action-soft */
  --c-action-text: #2650E0;  /* links / texto de ação */
  --c-selected-bg: #0E1726;  --c-selected-ink: #FFFFFF; /* chip/segmento selecionado */
  --c-focus: #2650E0;

  /* Sidebar (escura nos dois temas) */
  --c-rail: #0E1726;
  --c-rail-hover: #1C2A44;
  --c-rail-ink: #C9D2E0;
  --c-rail-ink-muted: #7F8BA0;

  /* Estados de registro */
  --c-done: #1F7A4D;      --c-done-soft: #E1F2E8;      --c-done-ink: #17603C;
  --c-attention: #B07A00; --c-attention-soft: #FBF1D9; --c-attention-ink: #7A5400;
  --c-error: #C0362C;     --c-error-soft: #FBE4E2;     --c-error-ink: #8E2620;
  --c-draft: #6B7385;     --c-draft-soft: #EEF0F4;     --c-draft-ink: #474F60;

  /* Delta de custo — Δ = baseline − competidor (mesma convenção do comparison.html)
     ▲ positivo = baseline mais caro (laranja) · ▼ negativo = baseline mais barato (petróleo)
     Nunca só cor: sempre seta + sinal + valor. */
  --c-delta-up: #B5470B;   --c-delta-up-soft: #FCE6D8;   --c-delta-up-ink: #8E3708;
  --c-delta-down: #0F6E78; --c-delta-down-soft: #DDF0F1; --c-delta-down-ink: #0B5860;

  /* Régua de cenários (mantida como no app atual: verde = mais barato à esquerda) */
  --ruler-gradient: linear-gradient(90deg, #10B981, #F59E0B, #EF4444);

  /* Séries de gráfico (subsistemas / produtos) */
  --c-series-1: #2650E0;  /* Cooling */
  --c-series-2: #8FA8FF;  /* SES */
  --c-series-3: #CBD2DC;  /* Structures */
  --c-product-baseline: #5B6577;
  --c-product-2: #2650E0;
  --c-product-3: #7A4CC2;

  /* Canvas (Flowline) */
  --c-board: #FBFCFD;
  --c-grid-dot: #D5DBE4;
  --c-sel: #2650E0;
  --c-guide: #E0368C;
}

/* ---------- Tema escuro (valores usados nas telas 30–33 · screens/3x-dark-*.html) ---------- */
html[data-theme="dark"] {
  color-scheme: dark;
  --c-canvas: #0B111C;
  --c-surface: #121A28;
  --c-surface-2: #162032;
  --c-surface-3: #1B263A;
  --c-line: #243149;
  --c-line-soft: #1D283C;
  --c-line-strong: #34425C;

  --c-ink-900: #EEF2F8;
  --c-ink-700: #C3CCDA;
  --c-ink-500: #8E9AB0;

  --c-action: #3D63E6;        /* fundo de botão primário, aba ativa, borda de foco */
  --c-action-hover: #5B7FF0;
  --c-action-text: #8FA8FF;   /* links e texto de ação sobre o fundo escuro */
  --c-action-soft: #1C2A4D;
  --c-action-ink: #AFC2FF;
  --c-focus: #5B7FF0;

  --c-rail: #070C15;
  --c-rail-hover: #162032;

  /* chip/segmento selecionado inverte: fundo claro, texto escuro */
  --c-selected-bg: #EEF2F8;   --c-selected-ink: #0B111C;

  --c-done: #2E9A63;      --c-done-soft: #12301F;      --c-done-ink: #7FD3A4;
  --c-attention: #D9A21B; --c-attention-soft: #33280B; --c-attention-ink: #F0C66A;
  --c-error: #F2958C;     --c-error-soft: #3A1714;     --c-error-ink: #F2958C;
  --c-draft-soft: #1E2636; --c-draft-ink: #B4BDCC;

  --c-delta-up-soft: #3A1F0E;   --c-delta-up-ink: #F5A673;
  --c-delta-down: #2BA3AE; --c-delta-down-soft: #0D2F33; --c-delta-down-ink: #7FCFD6;

  --c-series-1: #3D63E6;
  --c-series-3: #4A5873;
  --shadow-float: 0 8px 24px rgba(0, 0, 0, .45);
  --c-board: #0E1522;
  --c-grid-dot: #26324A;
  --c-sel: #5B7FF0;
}

/* ---------- Base ---------- */
html { font-size: 16px; } /* volta ao padrão: remove o hack de 17px + overrides de text-[Npx] */
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs-14);
  color: var(--c-ink-900);
  background: var(--c-canvas);
  -webkit-font-smoothing: antialiased;
}
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }

</style>
  <style>
/* ==========================================================================
   Flowline — componentes e layout. Todas as cores vêm de tokens.css.
   Mesmas regras do Precision Workspace: borda em vez de sombra, um acento,
   Geist para UI e Geist Mono para todo número.
   ========================================================================== */

* { box-sizing: border-box; }
html, body { height: 100%; }
body { overflow: hidden; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--c-ink-900); }
:where(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]), select, textarea) {
  background-color: var(--c-surface); border: 1px solid var(--c-line-strong); border-radius: var(--radius-control);
}
:where(input, select, textarea):focus { outline: none; border-color: var(--c-focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-focus) 18%, transparent); }
::placeholder { color: var(--c-ink-500); opacity: 1; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--c-action); }
* { scrollbar-width: thin; scrollbar-color: var(--c-line-strong) transparent; }
a { color: var(--c-action-text); }
svg { flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Primitivos ---------- */
.eyebrow { font-size: var(--fs-12); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink-500); }
.muted { color: var(--c-ink-500); }
.ink7 { color: var(--c-ink-700); }
.card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius-card); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--c-line-soft); }
.card-h h3 { margin: 0; font-size: var(--fs-16); font-weight: 600; }
.card-b { padding: 16px; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; }
.hr { height: 1px; background: var(--c-line); margin: 12px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-h); padding: 0 14px; border-radius: var(--radius-control);
  font-size: var(--fs-14); font-weight: 600; border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-ink-900); cursor: pointer; white-space: nowrap;
  transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease); }
.btn:hover { background: var(--c-surface-2); }
.btn-p { background: var(--c-action); border-color: var(--c-action); color: var(--c-on-solid, #fff); }
.btn-p:hover { background: var(--c-action-hover); border-color: var(--c-action-hover); }
.btn-g { background: transparent; border-color: transparent; color: var(--c-ink-700); }
.btn-g:hover { background: var(--c-surface-3); }
.btn-sm { height: 30px; padding: 0 10px; font-size: var(--fs-13); }
.btn-danger { color: var(--c-error); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.ib { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-control); border: 1px solid var(--c-line); background: var(--c-surface); color: var(--c-ink-700); cursor: pointer; }
.ib:hover { background: var(--c-surface-2); color: var(--c-ink-900); }
.ib.on { border-color: var(--c-action); color: var(--c-action-text); background: var(--c-action-soft); }
.ib-sm { width: 30px; height: 30px; }
.ib-ghost { border-color: transparent; background: transparent; }

.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); font-weight: 600; padding: 3px 8px; border-radius: var(--radius-pill); white-space: nowrap; line-height: 1.3; }
.st i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: currentColor; }
.st-draft { background: var(--c-draft-soft); color: var(--c-draft-ink); } .st-draft i { background: var(--c-draft); }
.st-att { background: var(--c-attention-soft); color: var(--c-attention-ink); } .st-att i { background: var(--c-attention); }
.st-done { background: var(--c-done-soft); color: var(--c-done-ink); } .st-done i { background: var(--c-done); }
.st-err { background: var(--c-error-soft); color: var(--c-error-ink); } .st-err i { background: var(--c-error); }
.st-act { background: var(--c-action-soft); color: var(--c-action-ink); } .st-act i { background: var(--c-action); }
.st-plain { background: var(--c-surface-3); color: var(--c-ink-700); }

.dl { font-family: var(--font-mono); font-size: var(--fs-13); font-weight: 600; padding: 2px 7px; border-radius: 5px; display: inline-flex; gap: 4px; align-items: center; }
.dl-down { background: var(--c-delta-down-soft); color: var(--c-delta-down-ink); }
.dl-up { background: var(--c-delta-up-soft); color: var(--c-delta-up-ink); }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--c-line-soft); }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; font-size: var(--fs-13); font-weight: 600; color: var(--c-ink-700); cursor: pointer; }
.seg button.on { background: var(--c-surface); color: var(--c-ink-900); box-shadow: 0 0 0 1px var(--c-line); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: var(--fs-13); font-weight: 600; color: var(--c-ink-700); }
.inp { height: 36px; padding: 0 10px; width: 100%; font-size: var(--fs-14); }
.inp-sm { height: 30px; font-size: var(--fs-13); padding: 0 8px; }
textarea.inp { height: auto; padding: 8px 10px; line-height: 1.5; resize: vertical; }

.av { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff; flex: none; letter-spacing: .02em; }
.avs { display: inline-flex; } .avs .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--c-surface); } .avs .av:first-child { margin-left: 0; }

.kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--c-line-strong); color: var(--c-ink-500); background: var(--c-surface); }

.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-14); }
.tbl th { text-align: left; font-size: var(--fs-12); font-weight: 600; color: var(--c-ink-500); background: var(--c-surface-2); padding: 9px 12px; border-bottom: 1px solid var(--c-line); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--c-line-soft); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--c-surface-2); }
.tbl .num { text-align: right; }

.bar { height: 6px; border-radius: 6px; background: var(--c-line-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c-action); border-radius: 6px; }

/* ---------- Shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.rail { width: var(--rail-w, 248px); flex: none; background: var(--c-rail); color: var(--c-rail-ink); display: flex; flex-direction: column; padding: 14px 10px; gap: 12px; transition: width var(--motion-base) var(--ease); overflow: hidden; }
.app.collapsed .rail { width: 64px; }
.app.no-anim .rail { transition: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 6px; color: #fff; text-decoration: none; }
.brand .logo { width: 40px; height: 40px; flex: none; }
.brand b { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }
.brand span { display: block; font-size: 13px; color: var(--c-rail-ink-muted); font-weight: 500; }
.newbtn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border-radius: 6px; border: 0; background: var(--c-action); color: #fff; font-weight: 600; cursor: pointer; }
.newbtn:hover { background: var(--c-action-hover); }
.rnav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1 1 auto; min-height: 0; margin: 0 -4px; padding: 0 4px; scrollbar-color: #2A3854 transparent; }
.ng { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--c-rail-ink-muted); padding: 14px 10px 6px; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: var(--c-rail-ink); text-decoration: none; white-space: nowrap; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.nav:hover { background: var(--c-rail-hover); color: #fff; }
.nav.on { background: var(--c-rail-hover); color: #fff; box-shadow: inset 2px 0 0 #8FA8FF; }
.nav .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--c-rail-ink-muted); }
.nav .pdot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.nav .pname { overflow: hidden; text-overflow: ellipsis; }
.app.collapsed .rail .lbl-x, .app.collapsed .rail .ng, .app.collapsed .rail .cnt, .app.collapsed .brand div, .app.collapsed .rfoot .lbl-x { display: none; }
.app.collapsed .nav { justify-content: center; padding: 0; }
.app.collapsed .newbtn span { display: none; }
.rfoot { border-top: 1px solid #1C2A44; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A9B4C6; }
.rfoot b { color: #fff; font-size: 13px; font-weight: 600; }

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--c-surface); border-bottom: 1px solid var(--c-line); flex: none; min-height: 57px; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--c-ink-500); margin-left: 8px; white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--c-ink-900); font-weight: 600; }
.crumbs a { color: inherit; text-decoration: none; } .crumbs a:hover { color: var(--c-ink-900); }
.search-trigger { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px; border: 1px solid var(--c-line); border-radius: 6px; background: var(--c-surface-2); color: var(--c-ink-500); cursor: pointer; min-width: 260px; font-size: 13px; }
.search-trigger:hover { border-color: var(--c-line-strong); }
.search-trigger .kbd { margin-left: auto; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-ink-700); padding: 0 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-done); }
.sync.busy i { background: var(--c-attention); }
.me { display: flex; align-items: center; gap: 8px; padding-left: 12px; margin-left: 4px; border-left: 1px solid var(--c-line); }
.me > div > b { display: block; font-size: 13px; font-weight: 600; line-height: 1.2; }
.me > div > span { display: block; font-size: 12px; color: var(--c-ink-500); }
.view { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
.page { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; }
.ph { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph h1 { margin: 0; font-size: var(--fs-22); font-weight: 700; letter-spacing: -.01em; }
.ph p { margin: 4px 0 0; color: var(--c-ink-500); }
.animate-in { animation: ain var(--motion-base) var(--ease) both; }
@keyframes ain { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.kpi .v { font-family: var(--font-mono); font-size: var(--fs-28); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.kpi .s { font-size: 13px; color: var(--c-ink-500); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* DMAIC stepper */
.dmaic { display: inline-flex; gap: 3px; }
.dmaic span { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--font-mono); background: var(--c-line-soft); color: var(--c-ink-500); }
.dmaic span.done { background: var(--c-done-soft); color: var(--c-done-ink); }
.dmaic span.cur { background: var(--c-action); color: #fff; }
.belt { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 8px 3px 6px; border-radius: 999px; background: var(--c-surface-3); color: var(--c-ink-700); }
.belt i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- Projeto ---------- */
.recbar { background: var(--c-surface); border-bottom: 1px solid var(--c-line); padding: 16px 24px 0; flex: none; }
.recbar .t { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.recbar h1 { margin: 0; font-size: var(--fs-22); font-weight: 700; letter-spacing: -.01em; }
.recbar .sum { margin-top: 6px; color: var(--c-ink-500); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.recbar .sum .sep { color: var(--c-line-strong); }
.ptabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.ptab { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--c-ink-500); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.ptab:hover { color: var(--c-ink-900); }
.ptab.on { color: var(--c-ink-900); border-bottom-color: var(--c-action); }
.ptab .c { font-family: var(--font-mono); font-size: 12px; color: var(--c-ink-500); background: var(--c-surface-3); padding: 1px 6px; border-radius: 999px; font-weight: 500; }
.pbody { flex: 1 1 auto; min-height: 0; position: relative; overflow: auto; }
.pbody.fill { overflow: hidden; display: flex; flex-direction: column; }

/* Jornada DMAIC (overview) */
.journey { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.jcol { padding: 16px; border-right: 1px solid var(--c-line-soft); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.jcol:last-child { border-right: 0; }
.jcol.cur { background: color-mix(in srgb, var(--c-action) 4%, var(--c-surface)); }
.jhead { display: flex; align-items: center; gap: 8px; }
.jletter { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; background: var(--c-line-soft); color: var(--c-ink-500); }
.jcol.done .jletter { background: var(--c-done); color: #fff; }
.jcol.cur .jletter { background: var(--c-action); color: #fff; }
.jhead > div > b { font-size: 15px; } .jhead > div > span { font-size: 12px; color: var(--c-ink-500); display: block; font-family: var(--font-mono); }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--c-ink-700); line-height: 1.4; cursor: pointer; padding: 3px 0; }
.chk .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--c-line-strong); flex: none; margin-top: 1px; display: grid; place-items: center; background: var(--c-surface); }
.chk.on .box { background: var(--c-done); border-color: var(--c-done); color: #fff; }
.chk.on .tx { color: var(--c-ink-500); }
.chk .lnk { font-size: 12px; color: var(--c-action-text); cursor: pointer; white-space: nowrap; }
.chk .auto { font-size: 11px; color: var(--c-done-ink); background: var(--c-done-soft); padding: 0 5px; border-radius: 4px; margin-left: 4px; }
.tollgate { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--c-line); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--c-ink-500); }

.ov-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.metric-row { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)) 120px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-line-soft); font-size: 14px; }
.metric-row:last-child { border-bottom: 0; }
.metric-row .mono { font-size: 14px; }
.feed { display: flex; flex-direction: column; }
.feed .it { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--c-line-soft); font-size: 13px; color: var(--c-ink-700); line-height: 1.45; }
.feed .it:last-child { border-bottom: 0; }
.feed time { font-family: var(--font-mono); font-size: 12px; color: var(--c-ink-500); display: block; }

/* Charter */
.charter { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
.cblock { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.cblock h4 { margin: 0; font-size: 13px; font-weight: 600; color: var(--c-ink-500); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.ed { border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; margin: -6px -8px; line-height: 1.55; min-height: 1.55em; outline: none; white-space: pre-wrap; }
.ed:hover { border-color: var(--c-line); }
.ed:focus { border-color: var(--c-focus); background: var(--c-surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-focus) 18%, transparent); }
.ed:empty::before { content: attr(data-ph); color: var(--c-ink-500); }
.smart { display: flex; gap: 4px; flex-wrap: wrap; }
.smart span { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--c-line-soft); color: var(--c-ink-500); }
.smart span.ok { background: var(--c-done-soft); color: var(--c-done-ink); }

/* ---------- Menus, modais, toasts, ⌘K ---------- */
.float { position: fixed; z-index: 1000; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 8px; box-shadow: var(--shadow-float); }
.menu { padding: 4px; min-width: 200px; max-height: 70vh; overflow: auto; }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 5px; background: none; font-size: 13px; color: var(--c-ink-900); cursor: pointer; text-align: left; white-space: nowrap; }
.menu .mi:hover, .menu .mi.hl { background: var(--c-surface-3); }
.menu .mi .k { margin-left: auto; color: var(--c-ink-500); font-family: var(--font-mono); font-size: 11px; padding-left: 16px; }
.menu .mi.danger { color: var(--c-error); }
.menu .ms { height: 1px; background: var(--c-line-soft); margin: 4px 2px; }
.menu .mh { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c-ink-500); padding: 8px 10px 4px; }
.menu .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.12); }
.scrim { position: fixed; inset: 0; background: rgba(9, 14, 24, .42); z-index: 900; display: grid; place-items: start center; padding-top: 10vh; animation: ain var(--motion-fast) var(--ease); }
.modal { width: min(640px, calc(100vw - 32px)); max-height: 80vh; display: flex; flex-direction: column; background: var(--c-surface); border-radius: 12px; border: 1px solid var(--c-line); box-shadow: var(--shadow-float); overflow: hidden; }
.modal.wide { width: min(980px, calc(100vw - 32px)); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--c-line); }
.modal-h h2 { margin: 0; font-size: 18px; font-weight: 600; }
.modal-b { padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 12px 20px; border-top: 1px solid var(--c-line); display: flex; justify-content: flex-end; gap: 8px; background: var(--c-surface-2); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.opt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { border: 1px solid var(--c-line); border-radius: 8px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; background: var(--c-surface); text-align: left; }
.opt:hover { border-color: var(--c-line-strong); }
.opt.on { border-color: var(--c-action); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-action) 15%, transparent); }
.opt b { font-size: 14px; } .opt span { font-size: 12px; color: var(--c-ink-500); line-height: 1.4; }

.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--c-ink-900); color: var(--c-canvas); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-float); display: flex; gap: 10px; align-items: center; animation: ain var(--motion-base) var(--ease); pointer-events: auto; }
.toast button { background: none; border: 0; color: #8FA8FF; font-weight: 600; cursor: pointer; padding: 0; }

.cmdk { width: min(640px, calc(100vw - 32px)); background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 12px; box-shadow: var(--shadow-float); overflow: hidden; }
.cmdk input { width: 100%; height: 52px; border: 0 !important; box-shadow: none !important; border-bottom: 1px solid var(--c-line) !important; border-radius: 0 !important; padding: 0 18px; font-size: 16px; background: transparent !important; }
.cmdk .res { max-height: 52vh; overflow: auto; padding: 6px; }
.cmdk .r { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.cmdk .r.hl { background: var(--c-action-soft); color: var(--c-action-ink); }
.cmdk .r small { color: var(--c-ink-500); margin-left: auto; font-size: 12px; white-space: nowrap; }
.cmdk .grp { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c-ink-500); padding: 10px 12px 4px; }
.cmdk .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--c-line); font-size: 12px; color: var(--c-ink-500); background: var(--c-surface-2); }

.empty { padding: 48px 24px; text-align: center; color: var(--c-ink-500); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty b { color: var(--c-ink-900); font-size: 16px; }

/* ---------- Plano (grid + Gantt) ---------- */
.ptool { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--c-line); background: var(--c-surface); flex: none; flex-wrap: wrap; }
.ptool .sep { width: 1px; height: 22px; background: var(--c-line); margin: 0 4px; }
.plan { flex: 1 1 auto; min-height: 0; display: flex; position: relative; background: var(--c-surface); }
.pgrid { flex: none; position: relative; border-right: 1px solid var(--c-line-strong); }
.splitter { width: 6px; margin-left: -3px; margin-right: -3px; cursor: col-resize; z-index: 5; flex: none; position: relative; }
.splitter:hover, .splitter.drag { background: color-mix(in srgb, var(--c-action) 35%, transparent); }
.pgantt { flex: 1 1 auto; overflow: auto; position: relative; background: var(--c-surface); }
.pgrid { overflow-x: auto; overflow-y: hidden; outline: none; }
.ghead { display: flex; height: 48px; position: sticky; top: 0; z-index: 3; background: var(--c-surface-2); border-bottom: 1px solid var(--c-line); }
.ghead .gc { height: 48px; font-size: 12px; font-weight: 600; color: var(--c-ink-500); display: flex; align-items: center; position: relative; user-select: none; }
.ghead .rz { position: absolute; right: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 2; }
.ghead .rz:hover { background: color-mix(in srgb, var(--c-action) 40%, transparent); }
.gbody { position: relative; }
.gr { position: absolute; left: 0; display: flex; height: 34px; border-bottom: 1px solid var(--c-line-soft); background: var(--c-surface); }
.gc { flex: none; height: 33px; padding: 0 8px; border-right: 1px solid var(--c-line-soft); display: flex; align-items: center; font-size: 13px; white-space: nowrap; overflow: hidden; min-width: 0; }
.gc > * { min-width: 0; }
.gc.rn { width: 46px; justify-content: center; color: var(--c-ink-500); font-family: var(--font-mono); font-size: 12px; background: var(--c-surface-2); position: sticky; left: 0; z-index: 2; cursor: pointer; padding: 0; }
.gc.mono { font-family: var(--font-mono); font-size: 12.5px; }
.gc.num { justify-content: flex-end; }
.gc.ctr { justify-content: center; }
.gc.ro { color: var(--c-ink-500); }
.gc.late { color: var(--c-error); font-weight: 600; }
.gc.sel { box-shadow: inset 0 0 0 2px var(--c-action); }
.gr.sum { background: var(--c-surface-2); }
.gr.sum .gc { font-weight: 600; }
.gr.sum .gc.rn { background: var(--c-surface-3); }
.gr.hov { background: color-mix(in srgb, var(--c-action) 5%, var(--c-surface)); }
.gr.sum.hov { background: color-mix(in srgb, var(--c-action) 5%, var(--c-surface-2)); }
.gr.selr .gc.rn { background: var(--c-action); color: #fff; }
.gr.add { border-bottom: 0; background: transparent; }
.gr.add .gc { border-right: 0; }
.gr.add .gc.rn { background: transparent; }
.cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-error); flex: none; }
.tn { display: flex; align-items: center; gap: 6px; overflow: hidden; width: 100%; }
.tn .tw { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--c-ink-500); cursor: pointer; flex: none; }
.tn .tw:hover { background: var(--c-surface-3); }
.tn .tt { overflow: hidden; text-overflow: ellipsis; }
.tn .lk { color: var(--c-action-text); cursor: pointer; flex: none; display: grid; place-items: center; }
.cell-ed { position: absolute; inset: 0; width: 100%; height: 100%; border: 2px solid var(--c-action) !important; border-radius: 0 !important; padding: 0 6px; font-size: 13px; z-index: 4; box-shadow: none !important; background: var(--c-surface) !important; }
.phase-chip { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-family: var(--font-mono); font-weight: 700; font-size: 11px; color: #fff; flex: none; }
.pct { display: flex; align-items: center; gap: 6px; width: 100%; } .pct .bar { flex: 1; height: 5px; }
.gwrap { min-width: 100%; }
.gsvg { display: block; }
.gsvg text { font-family: var(--font-ui); }
.gbar { cursor: grab; }
.gbar:active { cursor: grabbing; }
.gh { cursor: ew-resize; }
.glink { cursor: crosshair; opacity: 0; }
.gbar-g:hover .glink { opacity: 1; }
.gdep { fill: none; stroke: var(--c-ink-500); stroke-width: 1.25; }
.gdep.crit { stroke: var(--c-error); stroke-width: 1.6; }

/* Board (kanban com swimlanes) */
.board { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px; background: var(--c-canvas); }
.bgrid { display: grid; gap: 0; border: 1px solid var(--c-line); border-radius: 10px; overflow: hidden; background: var(--c-surface); }
.bhead { position: sticky; top: 0; z-index: 2; padding: 10px 12px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; background: var(--c-surface-2); border-bottom: 1px solid var(--c-line); border-right: 1px solid var(--c-line-soft); }
.blane { padding: 12px 14px; font-weight: 700; color: #fff; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,.15); writing-mode: horizontal-tb; min-height: 120px; }
.blane small { font-weight: 500; opacity: .85; font-size: 12px; }
.bcell { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--c-line-soft); border-right: 1px solid var(--c-line-soft); min-height: 120px; min-width: 0; transition: background var(--motion-fast); }
.bcell.over { background: var(--c-action-soft); }
.kcard { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: grab; font-size: 13px; border-left: 3px solid var(--c-line-strong); }
.kcard:hover { border-color: var(--c-line-strong); }
.kcard.dragging { opacity: .4; }
.kcard .t { font-weight: 600; line-height: 1.35; font-size: 13.5px; }
.kcard .m { display: flex; align-items: center; gap: 8px; color: var(--c-ink-500); font-size: 12px; }

/* ---------- Mapas (canvas) ---------- */
.cv { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr) 292px; grid-template-rows: minmax(0, 1fr) 38px; background: var(--c-canvas); }
.cv.nolib { grid-template-columns: 0 minmax(0, 1fr) 292px; }
.cv.noprops { grid-template-columns: 252px minmax(0, 1fr) 0; }
.cv.nolib.noprops { grid-template-columns: 0 minmax(0, 1fr) 0; }
.lib { grid-row: 1; background: var(--c-surface); border-right: 1px solid var(--c-line); overflow: auto; display: flex; flex-direction: column; }
.lib-s { padding: 10px; border-bottom: 1px solid var(--c-line); position: sticky; top: 0; background: var(--c-surface); z-index: 1; }
.lib-g { border-bottom: 1px solid var(--c-line-soft); }
.lib-gh { display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px; font-size: 12px; font-weight: 600; color: var(--c-ink-700); cursor: pointer; user-select: none; }
.lib-gh .chev { margin-left: auto; color: var(--c-ink-500); transition: transform var(--motion-fast); }
.lib-g.closed .chev { transform: rotate(-90deg); }
.lib-g.closed .lib-items { display: none; }
.lib-items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 2px 10px 12px; }
.lib-it { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; cursor: grab; border: 1px solid transparent; color: var(--c-ink-700); background: none; padding: 4px; }
.lib-it:hover { background: var(--c-surface-3); border-color: var(--c-line); }
.lib-it svg { width: 100%; height: 100%; overflow: visible; }
.lib-wide { grid-column: span 2; aspect-ratio: 2 / 1; font-size: 11px; font-weight: 600; flex-direction: column; display: flex; gap: 2px; align-items: center; justify-content: center; color: var(--c-ink-700); }

.stage { grid-row: 1; position: relative; overflow: hidden; background: var(--c-board); outline: none; }
.stage svg.world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; touch-action: none; }
.stage.pan, .stage.pan * { cursor: grab !important; }
.stage.panning, .stage.panning * { cursor: grabbing !important; }
.stage.tool-connector { cursor: crosshair; }
.ctool { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 10px; box-shadow: var(--shadow-float); z-index: 5; }
.ctool .ib { border-color: transparent; width: 32px; height: 32px; background: transparent; }
.ctool .ib.on { background: var(--c-action-soft); color: var(--c-action-text); }
.ctool .sep { width: 1px; height: 20px; background: var(--c-line); margin: 0 4px; }
.zoombox { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 8px; z-index: 5; }
.zoombox .ib { width: 28px; height: 28px; border-color: transparent; background: transparent; }
.zoombox .z { font-family: var(--font-mono); font-size: 12px; width: 48px; text-align: center; color: var(--c-ink-700); cursor: pointer; }
.minimap { position: absolute; left: 12px; bottom: 12px; width: 180px; height: 120px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 8px; z-index: 5; overflow: hidden; cursor: pointer; }
.minimap svg { width: 100%; height: 100%; display: block; }
.textedit { position: absolute; z-index: 20; border: 0; border-radius: 2px; background: transparent; padding: 0 6px; resize: none; outline: 1.5px dashed color-mix(in srgb, var(--c-action) 55%, transparent); outline-offset: 0; font-family: var(--font-ui); line-height: 1.3; text-align: center; overflow: hidden; caret-color: currentColor; box-sizing: border-box; }
.textedit::selection { background: color-mix(in srgb, var(--c-action) 35%, transparent); }
.dropzone-hint { position: absolute; inset: 12px; border: 2px dashed var(--c-action); border-radius: 12px; display: grid; place-items: center; font-weight: 600; color: var(--c-action-text); background: color-mix(in srgb, var(--c-action) 6%, transparent); z-index: 30; pointer-events: none; }

.pages { grid-column: 1 / -1; grid-row: 2; display: flex; align-items: stretch; background: var(--c-surface); border-top: 1px solid var(--c-line); overflow-x: auto; scrollbar-width: none; }
.pg { display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-right: 1px solid var(--c-line-soft); background: none; font-size: 13px; color: var(--c-ink-700); cursor: pointer; white-space: nowrap; position: relative; }
.pg:hover { background: var(--c-surface-2); color: var(--c-ink-900); }
.pg.on { background: var(--c-board); color: var(--c-ink-900); font-weight: 600; box-shadow: inset 0 2px 0 var(--c-action); }
.pg .ph-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #fff; border-radius: 3px; padding: 1px 4px; }
.pg-add { padding: 0 12px; border: 0; background: none; color: var(--c-ink-500); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.pg-add:hover { color: var(--c-action-text); }

.props { grid-row: 1; background: var(--c-surface); border-left: 1px solid var(--c-line); overflow: auto; font-size: 13px; }
.pp-s { padding: 14px 16px; border-bottom: 1px solid var(--c-line-soft); display: flex; flex-direction: column; gap: 10px; }
.pp-s h5 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c-ink-500); display: flex; align-items: center; gap: 6px; }
.pp-s h5 .right { text-transform: none; letter-spacing: 0; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.swatches button { aspect-ratio: 1; border-radius: 5px; border: 1px solid rgba(14,23,38,.14); cursor: pointer; padding: 0; position: relative; }
.swatches button.on::after { content: ''; position: absolute; inset: -3px; border: 2px solid var(--c-action); border-radius: 7px; }
.swatches button.none { background: repeating-linear-gradient(45deg, var(--c-surface) 0 4px, var(--c-line) 4px 5px) !important; }
.pp-row { display: grid; grid-template-columns: 84px 1fr; gap: 8px; align-items: center; }
.pp-row > span { color: var(--c-ink-500); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 1fr 1fr 24px; gap: 4px; align-items: center; }
.kv input { height: 28px; font-size: 12.5px; padding: 0 6px; min-width: 0; }
.kv input.k { color: var(--c-ink-700); font-weight: 600; }
.mini-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.mini-btns button { height: 28px; min-width: 28px; padding: 0 8px; border: 1px solid var(--c-line); border-radius: 5px; background: var(--c-surface); cursor: pointer; font-size: 12px; display: inline-grid; place-items: center; color: var(--c-ink-700); }
.mini-btns button.on { background: var(--c-selected-bg); color: var(--c-selected-ink); border-color: var(--c-selected-bg); }
.linked-task { border: 1px solid var(--c-line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--c-surface-2); }
.rule { border: 1px solid var(--c-line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.rule .rr { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 4px; }
.rule .rr input, .rule .rr select { height: 28px; font-size: 12px; padding: 0 6px; min-width: 0; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.statgrid div { background: var(--c-surface-2); border: 1px solid var(--c-line-soft); border-radius: 6px; padding: 6px 8px; }
.statgrid small { display: block; font-size: 11px; color: var(--c-ink-500); }
.statgrid b { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }

/* Ferramentas estruturadas (SIPOC, FMEA, Fishbone, Charter) */
.tool { grid-row: 1; grid-column: 2 / 4; overflow: auto; background: var(--c-canvas); }
.cv.toolmode { grid-template-columns: 0 minmax(0, 1fr) 0; }
.cv.toolmode .tool { grid-column: 1 / -1; }
.tool-in { padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px; }
.sipoc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.sipoc .sc { display: flex; flex-direction: column; min-height: 360px; }
.sipoc .sch { padding: 12px 14px; border-bottom: 1px solid var(--c-line); display: flex; align-items: center; gap: 10px; }
.sipoc .sch .L { width: 32px; height: 32px; border-radius: 8px; background: var(--c-ink-900); color: var(--c-canvas); display: grid; place-items: center; font-weight: 700; font-family: var(--font-mono); font-size: 16px; }
.sipoc .sc.p .sch .L { background: var(--c-action); color: #fff; }
.sipoc .sch b { display: block; font-size: 14px; } .sipoc .sch span { font-size: 12px; color: var(--c-ink-500); }
.sipoc ul { list-style: none; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.sipoc li { display: flex; align-items: flex-start; gap: 6px; padding: 7px 8px; border: 1px solid var(--c-line); border-radius: 6px; background: var(--c-surface); font-size: 13px; line-height: 1.4; }
.sipoc li .n { font-family: var(--font-mono); font-size: 11px; color: var(--c-ink-500); padding-top: 2px; }
.sipoc li .x { margin-left: auto; opacity: 0; cursor: pointer; color: var(--c-ink-500); }
.sipoc li:hover .x { opacity: 1; }
.sipoc li [contenteditable] { outline: none; flex: 1; min-width: 0; }
.sipoc .add { margin: 0 10px 10px; height: 32px; border: 1px dashed var(--c-line-strong); border-radius: 6px; background: none; color: var(--c-ink-500); cursor: pointer; font-size: 13px; }
.sipoc .add:hover { color: var(--c-action-text); border-color: var(--c-action); }

.fmea-wrap { overflow: auto; border: 1px solid var(--c-line); border-radius: 10px; background: var(--c-surface); }
.fmea { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 1500px; width: 100%; }
.fmea th { position: sticky; top: 0; background: var(--c-surface-2); font-size: 11.5px; font-weight: 600; color: var(--c-ink-500); text-align: left; padding: 8px; border-bottom: 1px solid var(--c-line); border-right: 1px solid var(--c-line-soft); vertical-align: bottom; z-index: 1; }
.fmea th.sc { text-align: center; width: 54px; }
.fmea td { border-bottom: 1px solid var(--c-line-soft); border-right: 1px solid var(--c-line-soft); padding: 0; vertical-align: top; }
.fmea td [contenteditable] { padding: 8px; min-height: 36px; outline: none; line-height: 1.4; }
.fmea td [contenteditable]:focus { box-shadow: inset 0 0 0 2px var(--c-action); }
.fmea td.sc select { width: 100%; height: 36px; border: 0; background: transparent; text-align: center; font-family: var(--font-mono); font-weight: 600; cursor: pointer; text-align-last: center; }
.fmea td.rpn { text-align: center; font-family: var(--font-mono); font-weight: 700; vertical-align: middle; padding: 0 8px; }
.fmea td.act { white-space: nowrap; vertical-align: middle; padding: 0 6px; }
.rpn-h { background: var(--c-error-soft); color: var(--c-error-ink); }
.rpn-m { background: var(--c-attention-soft); color: var(--c-attention-ink); }
.rpn-l { background: var(--c-done-soft); color: var(--c-done-ink); }

.fish-wrap { position: relative; }
.fish-side { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fcat { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.fcat-h { display: flex; align-items: center; gap: 8px; }
.fcat-h input { font-weight: 600; border: 1px solid transparent; background: transparent; height: 30px; padding: 0 6px; margin-left: -6px; flex: 1; min-width: 0; }
.fcat-h input:hover { border-color: var(--c-line); }
.cause { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.cause:hover { background: var(--c-surface-2); }
.cause input[type=text] { flex: 1; border: 1px solid transparent; background: transparent; height: 28px; padding: 0 6px; min-width: 0; font-size: 13px; }
.cause input[type=text]:focus { background: var(--c-surface); }
.cause .tag { cursor: pointer; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--c-line); color: var(--c-ink-500); white-space: nowrap; background: var(--c-surface); }
.cause .tag.on { background: var(--c-error-soft); color: var(--c-error-ink); border-color: transparent; }
.cause .tag.v { background: var(--c-done-soft); color: var(--c-done-ink); border-color: transparent; }

/* Templates / toolkit */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.tcard { display: flex; flex-direction: column; overflow: hidden; cursor: pointer; text-align: left; padding: 0; }
.tcard:hover { border-color: var(--c-line-strong); }
.tcard .pv { height: 140px; background: var(--c-board); border-bottom: 1px solid var(--c-line); display: grid; place-items: center; overflow: hidden; }
.tcard .pv svg { width: 92%; height: 88%; }
.tcard .tx { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tcard .tx b { font-size: 15px; }
.tcard .tx p { margin: 0; font-size: 13px; color: var(--c-ink-500); line-height: 1.45; }
.phase-tags { display: flex; gap: 4px; }

@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ov-grid, .charter { grid-template-columns: 1fr; }
  .search-trigger { min-width: 0; }
  .search-trigger .lbl-x { display: none; }
}
.rule .swatches { grid-template-columns: repeat(6, 22px); }

/* ---------- Acesso e compartilhamento ---------- */
.cv.readonly .props { pointer-events: none; opacity: .65; }
.cv.readonly .tool-in > *:not(.ph) { pointer-events: none; }
.me { display: flex; align-items: center; gap: 8px; }
.me > svg { color: var(--c-ink-500); }

/* ---------- Tags (clusters do Kanban) ---------- */
.tag-chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--tc) 14%, var(--c-surface)); color: color-mix(in srgb, var(--tc) 78%, var(--c-ink-900)); border: 1px solid color-mix(in srgb, var(--tc) 30%, transparent); }
.tag-chip.sys { border-style: dashed; }
html[data-theme="dark"] .tag-chip { background: color-mix(in srgb, var(--tc) 22%, var(--c-surface)); color: color-mix(in srgb, var(--tc) 45%, #fff); }
.swatch-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch-dot.on { box-shadow: 0 0 0 2px var(--c-surface), 0 0 0 4px var(--c-action); }
.board .bhead span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Process / Product Map Maker ---------- */
.mk { display: flex; flex-direction: column; gap: 12px; }
.mk-top { display: flex; gap: 12px; align-items: flex-end; }
.mk-steps { margin: 0; padding: 10px 12px 10px 30px; background: var(--c-surface-2); border: 1px solid var(--c-line); border-radius: 8px; font-size: 12.5px; line-height: 1.6; color: var(--c-ink-700); columns: 2; column-gap: 28px; }
.mk-head, .mk-row { display: grid; grid-template-columns: 1.1fr 1.2fr 1.6fr 32px; gap: 8px; align-items: start; }
.mk-head.mk-prod, .mk-row.mk-prod { grid-template-columns: 1fr 1.2fr 1.6fr 44px 32px; }
.mk-head span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c-ink-500); }
.mk-rows { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow: auto; padding-right: 2px; }
.mk-row textarea { resize: vertical; min-height: 54px; font-size: 12.5px; }
.mk-row .mono { font-size: 12px; }
.mk-chk { display: flex; align-items: center; gap: 4px; font-size: 12px; padding-top: 8px; color: var(--c-ink-700); }
.mk-loop { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid var(--c-line); }
.mk-g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
@media (max-width: 720px) { .mk-head { display: none; } .mk-row, .mk-row.mk-prod { grid-template-columns: 1fr; } .mk-steps { columns: 1; } .mk-g3 { grid-template-columns: 1fr; } }

  <script>
/* Flowline · kit — camadas flutuantes: toast, menu de contexto, modal, prompt. Nunca usa alert/confirm nativos. */
(function (FL) {
  const U = FL.util;
  const K = (FL.kit = {});

  /* Toast com ação opcional (ex.: Undo) */
  K.toast = (msg, opts = {}) => {
    let box = U.$('.toasts');
    if (!box) { box = U.el('<div class="toasts" role="status" aria-live="polite"></div>'); document.body.appendChild(box); }
    const t = U.el(`<div class="toast">${opts.icon ? U.ic(opts.icon) : ''}<span>${U.esc(msg)}</span>${opts.action ? `<button>${U.esc(opts.action)}</button>` : ''}</div>`);
    if (opts.action) t.querySelector('button').onclick = () => { opts.onAction && opts.onAction(); t.remove(); };
    box.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .2s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 220); }, opts.ms || 2600);
  };

  /* Menu flutuante.
     items: [{label, icon, kbd, danger, onClick, swatch} | '-' | {header}] */
  let openMenu = null;
  K.closeMenu = () => { if (openMenu) { openMenu.remove(); openMenu = null; document.removeEventListener('mousedown', outside, true); document.removeEventListener('keydown', onKey, true); } };
  function outside(e) { if (openMenu && !openMenu.contains(e.target)) K.closeMenu(); }
  function onKey(e) {
    if (!openMenu) return;
    const its = U.$$('.mi', openMenu); let i = its.findIndex((x) => x.classList.contains('hl'));
    if (e.key === 'Escape') { K.closeMenu(); e.preventDefault(); e.stopPropagation(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

/* Flowline · schedule — motor do plano (estilo Smartsheet): hierarquia por nível, dias úteis,
   predecessoras FS/SS/FF com lag, roll-up de tarefas-resumo e caminho crítico. */
(function (FL) {
  const D = FL.util.date;
  const SC = (FL.schedule = {});

  /** Estrutura derivada: parent, filhos, se é resumo. */
  SC.tree = (tasks) => {
    const parent = new Array(tasks.length).fill(-1);
    const stack = [];
    tasks.forEach((t, i) => {
      while (stack.length && tasks[stack[stack.length - 1]].level >= t.level) stack.pop();
      parent[i] = stack.length ? stack[stack.length - 1] : -1;
      stack.push(i);
    });
    const isSum = tasks.map((t, i) => i + 1 < tasks.length && tasks[i + 1].level > t.level);
    const idx = new Map(tasks.map((t, i) => [t.id, i]));
    return { parent, isSum, idx };
  };

  /** Fim de descendentes de i (exclusivo). */
  SC.subtreeEnd = (tasks, i) => { let j = i + 1; while (j < tasks.length && tasks[j].level > tasks[i].level) j++; return j; };

  SC.endFrom = (start, dur) => (dur <= 0 ? D.nextWork(start) : D.addWork(start, dur - 1));

  /** Recalcula datas: aplica predecessoras nas folhas e faz roll-up dos resumos. Muta tasks. */
  SC.compute = (tasks) => {
    if (!tasks.length) return;
    let tr = SC.tree(tasks);
    for (let pass = 0; pass < 12; pass++) {
      let changed = false;
      rollup(tasks, tr);
      tasks.forEach((t, i) => {
        if (tr.isSum[i]) return;
        t.dur = Math.max(0, Math.round(+t.dur || 0));
        t.milestone = t.dur === 0;
        let start = t.start ? D.nextWork(t.start) : D.today();
        let minStart = null;
        (t.preds || []).forEach((p) => {
          const j = tr.idx.get(p.id); if (j == null || j === i) return;
          const q = tasks[j]; const lag = +p.lag || 0; let s;
          if (p.type === 'SS') s = D.addWork(q.start, lag);
          else if (p.type === 'FF') s = D.addWork(D.addWork(q.end, lag), -(Math.max(t.dur, 1) - 1));
          else s = D.addWork(q.end, (q.milestone ? 0 : 1) + lag); // FS
          if (!minStart || s > minStart) minStart = s;
        });
        if (minStart && (t.preds || []).length) start = minStart;
        const end = SC.endFrom(start, t.dur);
        if (t.start !== start || t.end !== end) { t.start = start; t.end = end; changed = true; }
      });
      if (!changed) break;
      tr = SC.tree(tasks);
    }
    rollup(tasks, tr);
  };

  function rollup(tasks, tr) {
    for (let i = tasks.length - 1; i >= 0; i--) {
      if (!tr.isSum[i]) continue;
      const t = tasks[i]; const end = SC.subtreeEnd(tasks, i);
      let s = null, e = null, w = 0, done = 0, allDone = true, anyRisk = false, anyProg = false;
      for (let j = i + 1; j < end; j++) {
        if (tr.parent[j] !== i) continue;
        const c = tasks[j];
        if (!s || c.start < s) s = c.start; if (!e || c.end > e) e = c.end;
        const wd = Math.max(1, c.dur || 1); w += wd; done += wd * (c.pct || 0);
        if (c.status !== 'Done') allDone = false;
        if (c.status === 'At risk' || c.status === 'Blocked') anyRisk = true;
        if (c.status === 'In progress' || (c.pct > 0 && c.pct < 100)) anyProg = true;
      }
      if (s) { t.start = s; t.end = e; t.dur = D.workBetween(s, e); }
      t.pct = w ? Math.round(done / w) : 0; t.milestone = false;
      t.status = allDone ? 'Done' : anyRisk ? 'At risk' : anyProg || t.pct > 0 ? 'In progress' : 'Not started';
    }
  }

  /** Caminho crítico nas folhas. Retorna Set de ids críticos e mapa de folga (dias úteis). */
  SC.critical = (tasks) => {
    const tr = SC.tree(tasks);
    const leaves = tasks.map((t, i) => i).filter((i) => !tr.isSum[i] && tasks[i].start);
    if (!leaves.length) return { set: new Set(), slack: {} };
    const origin = leaves.reduce((m, i) => (tasks[i].start < m ? tasks[i].start : m), tasks[leaves[0]].start);
    const wi = (iso) => D.workBetween(origin, iso) - 1;
    const ES = {}, EF = {}, LF = {};
    leaves.forEach((i) => { ES[i] = wi(tasks[i].start); EF[i] = tasks[i].milestone ? ES[i] - 1 : wi(tasks[i].end); });
    const projEnd = Math.max(...leaves.map((i) => EF[i]));
    leaves.forEach((i) => (LF[i] = projEnd));
    // sucessores: deps da folha j apontando para folha i
    const deps = [];
    leaves.forEach((j) => (tasks[j].preds || []).forEach((p) => { const i = tr.idx.get(p.id); if (i != null && !tr.isSum[i]) deps.push({ i, j, type: p.type || 'FS', lag: +p.lag || 0 }); }));
    for (let pass = 0; pass < leaves.length + 2; pass++) {
      let ch = false;
      deps.forEach(({ i, j, type, lag }) => {
        const durJ = EF[j] - ES[j]; const LSj = LF[j] - durJ; const durI = EF[i] - ES[i];
        let lf;
        if (type === 'SS') lf = LSj - lag + durI; else if (type === 'FF') lf = LF[j] - lag; else lf = LSj - 1 - lag;
        if (lf < LF[i]) { LF[i] = lf; ch = true; }
      });
      if (!ch) break;
    }
    const set = new Set(); const slack = {};
    leaves.forEach((i) => { const s = LF[i] - EF[i]; slack[tasks[i].id] = s; if (s <= 0) set.add(tasks[i].id); });
    return { set, slack };
  };

  /** "3, 5SS+2, 7FF-1" -> preds com ids. Retorna {preds, error}. */
  SC.parsePreds = (str, tasks, selfIdx) => {
    const out = []; const parts = String(str || '').split(/[,;\s]+/).filter(Boolean);
    for (const p of parts) {
      const m = p.toUpperCase().match(/^(\d+)(FS|SS|FF)?([+-]\d+)?D?$/);
      if (!m) return { error: `Can't read "${p}". Use row numbers like 3, 5SS or 7FS+2.` };
      const row = +m[1] - 1;
      if (!tasks[row]) return { error: `Row ${m[1]} doesn't exist.` };
      if (row === selfIdx) return { error: 'A task can’t depend on itself.' };
      out.push({ id: tasks[row].id, type: m[2] || 'FS', lag: m[3] ? +m[3] : 0 });
    }
    // ciclo?
    const test = tasks.map((t, i) => (i === selfIdx ? { ...t, preds: out } : t));
    if (SC.hasCycle(test)) return { error: 'That would create a circular dependency.' };
    return { preds: out };
  };
  SC.fmtPreds = (t, tasks, tr) => (t.preds || []).map((p) => {
    const j = tr.idx.get(p.id); if (j == null) return '';
    return `${j + 1}${p.type && p.type !== 'FS' ? p.type : ''}${p.lag ? (p.lag > 0 ? '+' : '') + p.lag : ''}`;
  }).filter(Boolean).join(', ');

  SC.hasCycle = (tasks) => {
    const idx = new Map(tasks.map((t, i) => [t.id, i])); const state = new Array(tasks.length).fill(0);
    const visit = (i) => {
      if (state[i] === 1) return true; if (state[i] === 2) return false; state[i] = 1;
      for (const p of tasks[i].preds || []) { const j = idx.get(p.id); if (j != null && visit(j)) return true; }
      state[i] = 2; return false;
    };
    return tasks.some((_, i) => visit(i));
  };

  /** Fase DMAIC dominante de um projeto a partir do plano (primeira fase não concluída). */
  SC.phaseProgress = (p) => {
    const res = {}; const tr = SC.tree(p.tasks);
    FL.PHASES.forEach((ph) => {
      const ts = p.tasks.filter((t, i) => t.phase === ph.k && !tr.isSum[i]);
      const leaves = ts;
      const w = FL.util.sum(leaves.map((t) => Math.max(1, t.dur || 1)));
      const d = FL.util.sum(leaves.map((t) => Math.max(1, t.dur || 1) * (t.pct || 0)));
      const s = ts.reduce((m, t) => (!m || (t.start && t.start < m) ? t.start : m), null);
      const e = ts.reduce((m, t) => (!m || (t.end && t.end > m) ? t.end : m), null);
      res[ph.k] = { pct: w ? Math.round(d / w) : 0, start: s, end: e, count: ts.length };
    });
    return res;
  };
})(window.FL);

/* Flowline · API de dados.
   A interface é a mesma que o Apps Script vai expor (gas/Code.gs). O cliente nunca lê "a planilha":
   ele pede ao servidor só os projetos em que o usuário logado é membro, e o servidor confere
   o papel (owner / editor / viewer) a cada gravação.

   - FL.api.mode === 'gas'   → google.script.run (produção, usuário vem do login Google)
   - FL.api.mode === 'local' → backend simulado em IndexedDB, com as MESMAS regras de acesso,
                               para o protótipo funcionar sem servidor. */
(function (FL) {
  const U = FL.util;
  FL.CONFIG = { domain: 'whirlpool.com', appName: 'Flowline' };
  const API = (FL.api = {});
  const isGas = typeof google !== 'undefined' && google.script && google.script.run;
  API.mode = isGas ? 'gas' : 'local';

  /* ---------- Adaptador Apps Script ---------- */
  const gas = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler((e) => rej(new Error(e && e.message ? e.message : String(e))))[fn](...args));

  /* ---------- Backend local (simula o servidor) ---------- */
  const L = {};
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('flowline', 2);
    r.onupgradeneeded = () => { ['kv', 'assets'].forEach((n) => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

  const tx = async (store, mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };

    async session() {

      const user = s.users.find((u) => norm(u.email) === norm(email)) || s.users[0];

    async deleteProject(id) {

    async unshare(id, target) {
      const s = await L.load(); const email = L.currentEmail(); const cur = s.projects[id];
      const mine = cur && roleOf(cur, email); target = norm(target);

      if (roleOf(cur, target) === 'owner') fail('The owner cannot be removed');

    },
    async transferOwnership(id, target) {

      if (!cur || roleOf(cur, email) !== 'owner') fail('Only the owner can transfer ownership');

      cur.members.forEach((x) => { if (x.role === 'owner') x.role = 'editor'; }); m.role = 'owner'; cur.ownerEmail = m.email;

    },
    async requestAccess(id, note) {

      // não revela se o projeto existe: responde igual nos dois casos

    },

    async putAsset(projectId, dataURL) { const id = API.newId('IMG-'); await put('assets', id, dataURL); return id; },
    async getAssets() { const d = await db(); return new Promise((res) => { const out = {}; const t = d.transaction('assets'); t.objectStore('assets').openCursor().onsuccess = (e) => { const c = e.target.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); }; }); },

  };

  const remote = {

    saveProject: (p) => gas('apiSaveProject', JSON.stringify(p)),
    createProject: (p) => gas('apiCreateProject', JSON.stringify(p)),
    deleteProject: (id) => gas('apiDeleteProject', id),
    share: (id, email, role) => gas('apiShare', id, email, role),
    unshare: (id, email) => gas('apiUnshare', id, email),
    transferOwnership: (id, email) => gas('apiTransferOwnership', id, email),
    requestAccess: (id, note) => gas('apiRequestAccess', id, note || ''),
    answerRequest: (reqId, approve, role) => gas('apiAnswerRequest', reqId, approve, role || 'editor'),
    putAsset: (pid, dataURL) => gas('apiPutAsset', pid, dataURL),
    importAsset: (id, dataURL) => gas('apiPutAsset', null, dataURL),
    getAssets: async () => ({}),
    getAsset: (pid, id) => gas('apiGetAsset', pid, id),
    reset: async () => false,
    demoSwitchUser: async () => false,
  };

  Object.assign(API, isGas ? remote : local);
  API.roleOf = roleOf;
})(window.FL);

  <script>
/* Flowline · store — estado em memória da sessão do usuário logado.
   Só contém os projetos que o servidor (FL.api) devolveu para esse usuário.
   Gravação: a cada mudança, compara cada projeto com a última versão salva e envia só os que mudaram.
   Campos de interface (página ativa, colapsos, zoom do canvas) não contam como mudança. */
(function (FL) {
  const U = FL.util, API = FL.api;
  const S = (FL.store = { state: null, assets: {}, listeners: new Set(), lastSaved: null, saving: false, error: null });
  const saved = new Map(); // id → assinatura do último estado gravado
  const UI_KEYS = new Set(['activePage', 'collapsed', 'view', 'fitted', '_role', '_requests', 'version', 'updatedAt', 'updatedBy']);
  const sig = (p) => JSON.stringify(p, (k, v) => (UI_KEYS.has(k) ? undefined : v));

  const loadPrefs = () => { try { return JSON.parse(localStorage.getItem('fl-prefs') || 'null') || {}; } catch (_) { return {}; } };
  const savePrefs = () => { try { localStorage.setItem('fl-prefs', JSON.stringify(S.state.prefs)); } catch (_) { } };

  S.load = async () => {
    const ses = await API.session();
    S.state = { v: FL.SCHEMA, me: ses.user.name, meEmail: ses.user.email, meTitle: ses.user.title || '', directory: ses.directory, projects: ses.projects, prefs: { theme: 'light', rail: 'open', lang: 'en', ...loadPrefs() } };
    FL.appUrl = ses.appUrl || null;
    saved.clear(); S.state.projects.forEach((p) => saved.set(p.id, sig(p)));
    try { S.assets = await API.getAssets(); } catch (_) { S.assets = {}; }
    return S.state;
  };

  /* ---------- Gravação ---------- */
  let warned = 0, running = null, again = false, toastAt = 0;
  // Uma gravação por vez: no Apps Script cada uma leva 1–3 s; duas em paralelo mandariam a mesma versão e a segunda daria CONFLICT.
  S.flush = () => {
    if (running) { again = true; return running; }
    running = flushOnce().finally(() => { running = null; if (again) { again = false; S.flush(); } });
    return running;
  };
  const flushOnce = async () => {
    const dirty = S.state.projects.filter((p) => saved.get(p.id) !== sig(p));
    if (!dirty.length) { S.saving = false; S.emit('sync'); return; }
    S.saving = true; S.emit('sync');
    for (const p of dirty) {
      const s = sig(p);
      if (!S.canEdit(p)) { // viewer: desfaz localmente, o servidor recusaria de qualquer forma
        const back = JSON.parse(saved.get(p.id)); Object.keys(p).forEach((k) => { if (!UI_KEYS.has(k)) delete p[k]; }); Object.assign(p, back);
        if (Date.now() - warned > 3000) { warned = Date.now(); FL.kit.toast(FL.t('You have view-only access — changes were not saved')); }
        S.emit('reload'); continue;
      }
      try { const r = await API.saveProject(p); p.version = r.version; p.updatedAt = r.updatedAt; saved.set(p.id, s); S.error = null; }
      catch (e) {
        S.error = e.message;
        if (Date.now() - toastAt > 4000) { toastAt = Date.now(); FL.kit.toast(FL.t('Could not save') + ': ' + e.message); }
      }
    }
    S.saving = false; S.lastSaved = Date.now(); S.emit('sync');
  };
  S.saveNow = async () => { savePrefs(); await S.flush(); };
  const deb = U.debounce(() => S.flush(), 450);
  S.save = () => { savePrefs(); S.saving = true; S.emit('sync'); deb(); };

  S.addAsset = async (src, projectId) => { const id = await API.putAsset(projectId, src); S.assets[id] = src; return id; };
  /** No Apps Script as imagens vêm sob demanda (só para membros do projeto). */
  const pending = new Map();
  S.ensureAsset = (projectId, id) => {
    if (S.assets[id] || !API.getAsset) return Promise.resolve(S.assets[id]);
    if (!pending.has(id)) pending.set(id, API.getAsset(projectId, id).then((src) => (S.assets[id] = src)).catch(() => null));
    return pending.get(id);
  };
  S.reset = async () => { await API.reset(); await S.load(); };

  /* ---------- Projetos (via servidor) ---------- */
  S.createProject = async (p) => { const c = await API.createProject(p); S.state.projects.unshift(c); saved.set(c.id, sig(c)); return c; };
  S.deleteProject = async (id) => { await API.deleteProject(id); S.state.projects = S.state.projects.filter((p) => p.id !== id); saved.delete(id); };
  S.reloadSession = async () => { await S.load(); S.emit('session'); };

  /* ---------- Eventos ---------- */
  S.on = (fn) => { S.listeners.add(fn); return () => S.listeners.delete(fn); };
  S.emit = (evt, data) => S.listeners.forEach((fn) => { try { fn(evt, data); } catch (e) { console.error(e); } });

  /* ---------- Acesso ---------- */
  S.project = (id) => S.state.projects.find((p) => p.id === id);
  S.page = (p, id) => p && p.pages.find((g) => g.id === id);
  S.touch = (p) => { S.save(); };
  S.role = (p) => (p && p._role) || null;
  S.canEdit = (p) => ['owner', 'editor'].includes(S.role(p));
  S.isOwner = (p) => S.role(p) === 'owner';
  S.log = (p, text, who) => {
    if (!p) return; p.activity = p.activity || [];
    p.activity.unshift({ ts: Date.now(), who: who || S.state.me, text });
    p.activity.length = Math.min(p.activity.length, 200);
  };
  S.activity = () => S.state.projects.flatMap((p) => (p.activity || []).map((a) => ({ ...a, projectId: p.id }))).sort((a, b) => b.ts - a.ts);
  S.people = () => {
    const set = new Set(S.state.directory.map((d) => d.name));
    S.state.projects.forEach((p) => { p.team.forEach((t) => set.add(t.name)); p.tasks.forEach((t) => t.owner && set.add(t.owner)); });
    return [...set].sort();
  };
  S.nameOf = (email) => { const d = S.state.directory.find((x) => x.email.toLowerCase() === String(email).toLowerCase()); return d ? d.name : String(email).split('@')[0]; };
  S.emailOf = (name) => { const d = S.state.directory.find((x) => x.name === name); return d ? d.email : null; };

  /* ---------- Histórico (undo/redo por escopo: 'plan:<pid>', 'page:<pgid>') ---------- */
  const H = {};
  const hk = (k) => (H[k] = H[k] || { u: [], r: [] });
  /** Guarda o estado anterior antes de uma mutação. snap é string JSON. */
  S.record = (key, snap) => { const h = hk(key); h.u.push(snap); if (h.u.length > 120) h.u.shift(); h.r.length = 0; };
  S.undo = (key, current) => { const h = hk(key); if (!h.u.length) return null; h.r.push(current); return h.u.pop(); };
  S.redo = (key, current) => { const h = hk(key); if (!h.r.length) return null; h.u.push(current); return h.r.pop(); };
  S.canUndo = (key) => hk(key).u.length > 0;
  S.canRedo = (key) => hk(key).r.length > 0;

  /* ---------- Export / import (só os projetos que o usuário vê) ---------- */
  S.exportJSON = () => {
    const ids = new Set(); const projects = S.state.projects.map((p) => { const c = U.clone(p); delete c._role; delete c._requests; JSON.stringify(c).replace(/IMG-[A-Z0-9]{16}|img_[a-z0-9]+/g, (m) => ids.add(m)); return c; });
    const assets = {}; ids.forEach((id) => { if (S.assets[id]) assets[id] = S.assets[id]; });

  };
  S.importJSON = async (text) => {
    const o = JSON.parse(text);
    if (!o || !Array.isArray(o.projects)) throw new Error('Invalid Flowline file');
    for (const [id, src] of Object.entries(o.assets || {})) { S.assets[id] = src; try { await FL.api.importAsset(id, src); } catch (_) { } }
    // cada projeto importado vira um projeto novo do usuário atual (o servidor gera um ID novo)
    for (const p of o.projects) { const c = U.clone(p); c.name = c.name + ' (imported)'; delete c.members; await S.createProject(c); }
    return o.projects.length;
  };
})(window.FL);

/* Flowline · gráficos vivos no canvas — substituem o print do Minitab colado no mapa.
   I-MR (com regras de Western Electric 1 e 2), Pareto, capabilidade (Cp/Cpk/Pp/Ppk) e run chart.
   Saída: SVG puro (exporta para PNG/SVG sem perder nada). */
(function (FL) {
  const U = FL.util;
  const CH = (FL.charts = {});

  CH.TYPES = { imr: 'I-MR control chart', pareto: 'Pareto chart', cap: 'Capability histogram', run: 'Run chart' };

  const mean = (a) => (a.length ? U.sum(a) / a.length : 0);
  const sd = (a) => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(U.sum(a.map((v) => (v - m) ** 2)) / (a.length - 1)); };

  /* ---------- Lean Six Sigma: TMAP ---------- */
  const node = (name, fill, o = {}) => ({

      if (o.tag) extra = `<text x="12" y="17" font-size="10" font-weight="700" letter-spacing=".08em" fill="${ink}" fill-opacity=".75" font-family="Geist">${o.tag}</text>`;
      const shape = o.note ? `<path d="M0 0H${s.w}V${s.h - 14}L${s.w - 14} ${s.h}H0Z" fill="${f}" stroke="${s.stroke || 'rgba(14,23,38,.18)'}"/><path d="M${s.w} ${s.h - 14}H${s.w - 14}V${s.h}" fill="rgba(14,23,38,.1)"/>`
        : `<rect width="${s.w}" height="${s.h}" rx="${o.r ?? 6}" fill="${f}" stroke="${s.stroke || o.stroke || 'none'}" stroke-width="${sw(s)}"/>`;
      return shape + extra + txt({ ...s, bold: s.bold ?? o.bold }, o.tag ? { x: 0, y: 14, w: s.w, h: s.h - 14 } : full(s), c, { color: ink, align: o.align });
    },
    tbox: (s) => (o.tag ? { x: 0, y: 14, w: s.w, h: s.h - 14 } : full(s)),

  T['tmap-q'] = node('Question / hypothesis', '#2E9A63', { tag: 'QUESTION', bold: true });
  T['tmap-a'] = node('Action / tool used', '#2650E0', { tag: 'ACTION' });
  T['tmap-d'] = node('Decision / finding', '#FCE38A', { note: true, align: 'left' });
  T['tmap-l'] = node('Key learning', '#0E1726', { tag: 'KEY LEARNING', align: 'left', stroke: '#5B6577' });
  T.phase = {
    name: 'Phase marker', group: 'Thought process map', w: 48, h: 48, fixedRatio: true,
    render(s, c) { const f = s.fill || PH[(s.text || 'D')[0]] || c.action; const r = Math.min(s.w, s.h) / 2; return `<circle cx="${s.w / 2}" cy="${s.h / 2}" r="${r}" fill="${f}"/><text x="${s.w / 2}" y="${s.h / 2 + r * 0.36}" text-anchor="middle" font-size="${r}" font-weight="700" fill="#fff" font-family="Geist Mono, monospace">${U.esc((s.text || 'D').slice(0, 2))}</text>`; },

  };

  /* ---------- PMAP: passo com saídas (Y) acima e entradas (X: C/N/S) abaixo ---------- */
  const PS = { box: 72, row: 20, head: 22, gap: 10 };
  T.pstep = {
    name: 'Process step (X/Y)', group: 'Process map', w: 220, h: 200,

      const outs = s.outputs || [], ins = s.inputs || []; const b = T.pstep.body(s);

      o += `<line x1="${s.w / 2}" y1="${b.y - PS.gap}" x2="${s.w / 2}" y2="${b.y}" stroke="${c.lineStrong}"/>`;
      o += `<rect x="0" y="${b.y}" width="${s.w}" height="${PS.box}" rx="6" fill="${f}" stroke="${s.stroke || c.action}" stroke-width="1.6"/>` + txt({ ...s, bold: true }, b, c, { color: SH.onFill(f, c) });
      const y2 = b.y + PS.box + PS.gap;
      o += `<line x1="${s.w / 2}" y1="${y2 - PS.gap}" x2="${s.w / 2}" y2="${y2}" stroke="${c.lineStrong}"/>`;

  /* ---------- Product map: cartão de componente com características ---------- */

      o += `<rect x="8" y="${y - 4}" width="${s.w - 16}" height="${Math.max(1, items.length) * 22 + 8}" rx="4" fill="none" stroke="${c.error}" stroke-dasharray="4 3" stroke-opacity=".7"/>`;

        o += `<text x="16" y="${yy}" font-size="12.5" fill="${c.ink7}" font-family="Geist">${U.esc(it.t)}</text>${tag}`;

    tbox: (s) => ({ x: 0, y: 0, w: s.w, h: 34 }),
  };
  /* ---------- Padrão Whirlpool GB (copiado do Lucid do Green Belt) ----------
     Process map: y's acima, passo verde, x's abaixo ("C - ...", "N - ...", "SO - ...", * = crítico).
     Product map: cartão com funções y{n}.{k} em vermelho tracejado, foto, nome em barra cinza
     (laranja = componente alterado) e características x{n}.{k} em caixa cinza tracejada. */
  const GB = (SH.GB = { green: '#C8F2C2', greenLine: '#3A8A3A', bar: '#57C35F', barLight: '#CBF0C9', grey: '#D9DCE1', red: '#D23F3F', orange: '#F7963A', panel: '#CDD3DB', ink: '#1E1E1E', sub: '#4A4A4A' });
  const FS = 11.5, LH = 14.5;
  const gbLines = (arr, w, bold) => arr.flatMap((t) => U.wrap(t, w, FS, bold ? 600 : 400));
  const gbText = (lines, x, y, o = {}) => lines.length ? `<text font-size="${FS}" font-weight="${o.bold ? 600 : 400}" fill="${o.color || GB.sub}" text-anchor="${o.anchor || 'middle'}" font-family="Geist, system-ui, sans-serif"${o.deco ? ` text-decoration="${o.deco}"` : ''}>${lines.map((l, i) => `<tspan x="${x}" y="${y + i * LH + FS}">${U.esc(l)}</tspan>`).join('')}</text>` : '';
  SH.gbX = (it) => `${it.c || 'C'} - ${it.t}${it.crit ? '*' : ''}`;
  SH.parseX = (line) => { const m = line.match(/^\s*(SO|C|N)\s*[-–:]\s*(.*?)\s*(\*)?\s*$/i); return m ? { c: m[1].toUpperCase(), t: m[2], crit: !!m[3] } : { c: 'C', t: line.replace(/\*\s*$/, '').trim(), crit: /\*\s*$/.test(line) }; };

  const gbStepParts = (s) => {
    const w = s.w - 4;
    const ys = (s.outputs || []).length ? ["y's:", ...gbLines(s.outputs, w)] : [];
    const xs = (s.inputs || []).length ? ["x's:", ...gbLines((s.inputs || []).map(SH.gbX), w)] : [];
    const top = ys.length ? ys.length * LH + 8 : 0; const bh = s.bh || 64;
    return { ys, xs, top, bh };
  };
  T['gb-step'] = {
    name: 'Process step (GB)', group: 'Process map', w: 170, h: 160,
    autoH: (s) => { const p = gbStepParts(s); return p.top + p.bh + (p.xs.length ? 8 + p.xs.length * LH : 0); },
    body: (s) => { const p = gbStepParts(s); return { x: 0, y: p.top, w: s.w, h: p.bh }; },
    render(s, c) {
      const p = gbStepParts(s); const f = s.fill || GB.green;
      let o = gbText(p.ys, s.w / 2, 0);

  const gbCompParts = (s) => {

    const items = (s.items || []).map((it, i) => ({ ...it, lines: U.wrap(`x${n}.${i + 1} - ${it.t}${it.crit ? '*' : ''}`, w, FS, 400) }));
    const fh = funcs.length ? funcs.length * LH + 16 : 0;
    const ih = s.imgH || 120; const nameY = 10 + (fh ? fh + 10 : 0) + ih + 8;
    const xh = items.length ? U.sum(items.map((i) => i.lines.length)) * LH + 12 : 0;
    return { funcs, items, fh, ih, nameY, xh, h: nameY + 34 + (xh ? 6 + xh : 0) + 10 };

  T['gb-comp'] = {
    name: 'Component (GB)', group: 'Product map', w: 280, h: 300,

      o += src ? `<image href="${src}" x="10" y="${iy}" width="${s.w - 20}" height="${p.ih}" preserveAspectRatio="xMidYMid meet"/>`

      o += `<rect x="10" y="${p.nameY}" width="${s.w - 20}" height="34" rx="3" fill="${s.changed ? GB.orange : GB.grey}" stroke="#3C3C3C" stroke-width="1"/>`;
      o += `<text x="${s.w / 2}" y="${p.nameY + 21.5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${GB.ink}" text-decoration="underline" font-family="Geist, system-ui, sans-serif">${U.esc(U.wrap((s.text || '').toUpperCase(), s.w - 30, 12.5, 700)[0] || '')}</text>`;
      if (p.xh) {

        let y = y0 + 6; p.items.forEach((it) => { o += gbText(it.lines, 16, y, { anchor: 'start', color: it.st === '+' ? GB.red : it.st === '~' ? '#8A8A8A' : GB.ink, deco: it.st === '~' ? 'line-through' : '' }); y += it.lines.length * LH; });
      }
      return o;

    tbox: (s) => ({ x: 10, y: gbCompParts(s).nameY, w: s.w - 20, h: 34 }),

  /** Lista automática dos x's críticos (*) dos componentes / passos do mesmo grupo. */
  const critList = (s, page) => {
