    const out = [];
    sh.filter((q) => q.type === 'gb-comp').sort((a, b) => (a.n ?? 0) - (b.n ?? 0)).forEach((q) => (q.items || []).forEach((it, i) => { if (it.crit && it.st !== '~') out.push(`x${q.n ?? 1}.${i + 1} - ${(q.text || '').toLowerCase()} · ${it.t}*`); }));
    sh.filter((q) => q.type === 'gb-step').sort((a, b) => a.x - b.x).forEach((q) => (q.inputs || []).forEach((it) => { if (it.crit) out.push(`${it.c} - ${it.t}* (${q.text})`); }));
    return out;
  };
  SH.critList = critList;
  T['gb-crit'] = {
    name: "Critical X's (auto)", group: 'Product map', w: 420, h: 120,
    autoH: (s, page) => { if (!page) return s.h; const l = gbLines(critList(s, page), s.w - 32); return 34 + 6 + Math.max(1, l.length) * LH + 12; },
    render(s, c, page) {
      const l = gbLines(critList(s, page), s.w - 32);
      let o = `<rect width="${s.w}" height="30" rx="3" fill="${GB.grey}" stroke="#3C3C3C"/><text x="${s.w / 2}" y="19.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="${GB.ink}" font-family="Geist">${U.esc(s.text || "CRITICAL X's")}</text>`;
      o += `<rect y="36" width="${s.w}" height="${s.h - 36}" fill="none" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="7 4"/>`;
      o += l.length ? gbText(l, 10, 42, { anchor: 'start', color: GB.ink }) : `<text x="10" y="56" font-size="11.5" fill="${c.ink5}" font-family="Geist">Mark characteristics with * to list them here</text>`;
      return o;
    },
    tbox: (s) => ({ x: 0, y: 0, w: s.w, h: 30 }),
  };
  T['gb-legend'] = {
    name: 'Changed components legend', group: 'Product map', w: 230, h: 84,
    render(s) {
      return `<rect width="${s.w}" height="40" rx="2" fill="${GB.orange}" stroke="#3C3C3C"/><text x="${s.w / 2}" y="25" text-anchor="middle" font-size="12.5" font-weight="700" fill="${GB.ink}" font-family="Geist">CHANGED COMPONENTS</text>
        <rect y="46" width="${s.w}" height="38" fill="none" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="7 4"/>${gbText(['excluded'], 6, 48, { anchor: 'start', color: '#8A8A8A', deco: 'line-through', bold: true })}${gbText(['included'], 6, 48 + LH, { anchor: 'start', color: GB.red, bold: true })}`;
    },
    tbox: () => null,
  };
  /** Moldura cinza do process map com título preto: "(Y: ...) Process Map". */
  T['gb-panel'] = {
    name: 'Process map panel (GB)', group: 'Process map', w: 1200, h: 360, container: true,
    render(s, c) {
      const tw = Math.min(s.w - 20, U.measure(s.text || '', 15, 700) + 48);
      return `<rect width="${s.w}" height="${s.h}" fill="${s.fill || GB.panel}" stroke="${s.stroke || '#8A939E'}" stroke-width="1.2"/><rect x="10" y="10" width="${tw}" height="32" fill="#0E1116"/>` + txt({ ...s, fs: s.fs || 15, bold: true }, { x: 10, y: 10, w: tw, h: 32 }, c, { color: '#FFFFFF', pad: 6 });
    },
    tbox: (s) => ({ x: 10, y: 10, w: Math.min(s.w - 20, U.measure(s.text || '', 15, 700) + 48), h: 32 }),
  };
  T.kaizen = {
    name: 'Kaizen burst', group: 'Value stream', w: 150, h: 90,
    render(s, c) {
      const n = 12, cx = s.w / 2, cy = s.h / 2; let d = '';
      for (let i = 0; i < n * 2; i++) { const a = (Math.PI * i) / n; const r = i % 2 ? 0.78 : 1; d += `${i ? 'L' : 'M'}${cx + Math.cos(a) * cx * r} ${cy + Math.sin(a) * cy * r}`; }
      const f = s.fill || '#FCE6D8';
      return `<path d="${d}Z" fill="${f}" stroke="${s.stroke || '#B5470B'}" stroke-width="1.6" stroke-linejoin="round"/>` + txt({ ...s, bold: true, fs: s.fs || 12.5 }, { x: s.w * 0.18, y: s.h * 0.18, w: s.w * 0.64, h: s.h * 0.64 }, c, { color: SH.onFill(f, c), pad: 0 });
    },
    tbox: (s) => ({ x: s.w * 0.18, y: s.h * 0.18, w: s.w * 0.64, h: s.h * 0.64 }),
  };
  /* ---------- VSM ---------- */
  T['vsm-proc'] = {
    name: 'VSM process + data box', group: 'Value stream', w: 170, h: 200,
    render(s, c) {
      const d = s.data || {}; const keys = Object.keys(d); const f = s.fill || c.surface;
      let o = `<rect width="${s.w}" height="56" fill="${f}" stroke="${s.stroke || c.ink9}" stroke-width="1.6"/>` + txt({ ...s, bold: true }, { x: 0, y: 0, w: s.w, h: 56 }, c, { color: SH.onFill(f, c) });
      o += `<rect y="62" width="${s.w}" height="${s.h - 62}" fill="${c.surface}" stroke="${s.stroke || c.ink9}" stroke-width="1.2"/>`;
      keys.forEach((k, i) => { const y = 84 + i * 24; o += `<text x="10" y="${y}" font-size="12" fill="${c.ink5}" font-family="Geist">${U.esc(k)}</text><text x="${s.w - 10}" y="${y}" text-anchor="end" font-size="12.5" font-weight="600" fill="${c.ink9}" font-family="Geist Mono, monospace">${U.esc(d[k])}</text>`; if (i < keys.length - 1) o += `<line x1="8" x2="${s.w - 8}" y1="${y + 8}" y2="${y + 8}" stroke="${c.line}"/>`; });
      return o;
    },
    tbox: (s) => ({ x: 0, y: 0, w: s.w, h: 56 }), autoH: (s) => 62 + Math.max(1, Object.keys(s.data || {}).length) * 24 + 12,
  };
  T['vsm-inv'] = {
    name: 'Inventory', group: 'Value stream', w: 70, h: 62,
    render(s, c) { const d = s.data || {}; return `<path d="M${s.w / 2} 0L${s.w} ${s.h}H0Z" fill="${s.fill || '#FBF1D9'}" stroke="${s.stroke || '#B07A00'}" stroke-width="1.6" stroke-linejoin="round"/><text x="${s.w / 2}" y="${s.h * 0.78}" text-anchor="middle" font-size="${s.h * 0.34}" font-weight="700" fill="#7A5400" font-family="Geist">I</text>${d.Days != null ? `<text x="${s.w / 2}" y="${s.h + 16}" text-anchor="middle" font-size="12" font-weight="600" fill="${c.ink7}" font-family="Geist Mono, monospace">${U.esc(d.Days)} d</text>` : ''}`; },
    tbox: () => null,
  };
  T['vsm-ext'] = {
    name: 'Supplier / customer', group: 'Value stream', w: 150, h: 100,
    render(s, c) { const w = s.w, h = s.h * 0.62; const f = s.fill || c.surface; return `<path d="M0 ${h}V${h * 0.35}L${w / 3} 0V${h * 0.35}L${(2 * w) / 3} 0V${h * 0.35}L${w} 0V${h}Z" transform="translate(0 ${s.h - h})" fill="${f}" stroke="${s.stroke || c.ink9}" stroke-width="1.6" stroke-linejoin="round"/>` + txt({ ...s, fs: s.fs || 12.5, bold: true }, { x: 0, y: s.h - h * 0.62, w: s.w, h: h * 0.62 }, c, { color: SH.onFill(f, c), pad: 4 }); },
    tbox: (s) => ({ x: 0, y: s.h * 0.62, w: s.w, h: s.h * 0.38 }),
  };
  T['vsm-time'] = {
    name: 'VSM timeline (auto)', group: 'Value stream', w: 1200, h: 90,
    render(s, c, page) {
      const shapes = (page && page.data.shapes) || [];
      const procs = shapes.filter((x) => x.type === 'vsm-proc').sort((a, b) => a.x - b.x);
      const invs = shapes.filter((x) => x.type === 'vsm-inv').sort((a, b) => a.x - b.x);
      const num = (v) => parseFloat(String(v ?? '').replace(',', '.')) || 0;
      const ct = (p) => num((p.data || {})['C/T (s)'] ?? (p.data || {})['C/T']);
      const lead = U.sum(invs.map((i) => num((i.data || {}).Days)));
      const va = U.sum(procs.map(ct));
      const pce = lead ? (va / (lead * 8 * 3600)) * 100 : 0; // 1 dia = 1 turno de 8 h
      const bw = s.w - 210; const n = Math.max(1, procs.length); const seg = bw / n;
      let o = `<rect width="${s.w}" height="${s.h}" fill="none"/>`; let x = 0; let d = '';
      for (let i = 0; i < n; i++) {
        const inv = invs[i]; const p = procs[i];
        d += `${i ? 'L' : 'M'}${x} 14H${x + seg * 0.5}V${s.h - 34}H${x + seg}V14`;
        o += `<text x="${x + seg * 0.25}" y="10" text-anchor="middle" font-size="11.5" font-weight="600" fill="${c.ink7}" font-family="Geist Mono, monospace">${inv ? num(inv.data && inv.data.Days) + ' d' : '—'}</text>`;
        o += `<text x="${x + seg * 0.75}" y="${s.h - 18}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${c.action}" font-family="Geist Mono, monospace">${p ? ct(p) + ' s' : '—'}</text>`;
        x += seg;
      }
      o += `<path d="${d}" fill="none" stroke="${c.ink9}" stroke-width="1.6"/>`;
      const bx = bw + 20;
      o += `<rect x="${bx}" y="0" width="190" height="${s.h}" rx="8" fill="${c.surface}" stroke="${c.ink9}" stroke-width="1.2"/>
        <text x="${bx + 12}" y="22" font-size="11.5" fill="${c.ink5}" font-family="Geist">Lead time</text><text x="${bx + 178}" y="22" text-anchor="end" font-size="13" font-weight="700" fill="${c.ink9}" font-family="Geist Mono, monospace">${lead.toFixed(1)} d</text>
        <text x="${bx + 12}" y="46" font-size="11.5" fill="${c.ink5}" font-family="Geist">Value-add time</text><text x="${bx + 178}" y="46" text-anchor="end" font-size="13" font-weight="700" fill="${c.action}" font-family="Geist Mono, monospace">${va} s</text>
        <text x="${bx + 12}" y="70" font-size="11.5" fill="${c.ink5}" font-family="Geist">PCE</text><text x="${bx + 178}" y="70" text-anchor="end" font-size="13" font-weight="700" fill="${pce < 1 ? c.error : c.done}" font-family="Geist Mono, monospace">${pce.toFixed(3)}%</text>`;
      return o;
    },
    tbox: () => null,
  };
  /* ---------- Gráfico vivo ---------- */
  T.chart = {
    name: 'Live chart', group: 'Analysis', w: 560, h: 320,
    render(s, c) {
      return `<rect width="${s.w}" height="${s.h}" rx="8" fill="${c.surface}" stroke="${c.line}"/><g transform="translate(14 12)">${FL.charts.draw(s, s.w - 28, s.h - 24, c)}</g>`;
    },
    tbox: () => null,
  };

  SH.T = T;
  SH.def = (type) => T[type] || T.process;
  SH.textBox = (s) => { const d = SH.def(s.type); if (d.tbox) return d.tbox(s); return full(s); };
  SH.body = (s) => { const d = SH.def(s.type); return d.body ? d.body(s) : full(s); };

  SH.create = (type, x, y, extra = {}) => {
    const d = SH.def(type);

    s.text = defaults[type] ?? '';

    if (type === 'gb-step') { s.text = 'Process step'; s.outputs = ['Output of this step']; s.inputs = [{ c: 'C', t: 'Controllable input' }, { c: 'N', t: 'Noise' }]; }
    if (type === 'gb-comp') { s.text = 'Component'; s.n = 1; s.funcs = ['What is it for?']; s.items = [{ t: 'material' }, { t: 'size', crit: true }]; }
    if (type === 'gb-panel') s.text = '(Y: Output) Process Map';
    if (type === 'vsm-proc') s.data = { 'C/T (s)': 60, 'C/O (min)': 10, 'Uptime %': 95, Operators: 1 };
    if (type === 'vsm-inv') s.data = { Days: 1 };
    if (type === 'chart') Object.assign(s, { chart: 'imr', title: 'I-MR chart', values: [] });
    Object.assign(s, extra);
    if (d.autoH) s.h = d.autoH(s);
    return s;
  };

  /* Ícones da biblioteca (40×40) */
  SH.preview = (type) => {
    const d = SH.def(type); const st = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"';
    const special = {
      text: `<text x="20" y="27" text-anchor="middle" font-size="20" font-weight="600" fill="currentColor" font-family="Geist">T</text>`,
      sticky: `<path d="M6 6h28v20l-8 8H6z" fill="#FCE38A" stroke="#B07A00" stroke-width="1"/>`,
      frame: `<rect x="4" y="7" width="32" height="26" rx="3" ${st}/><path d="M4 13h32" ${st}/>`,
      lane: `<rect x="3" y="8" width="34" height="24" ${st}/><path d="M11 8v24M11 20h26" ${st}/>`,
      image: `<rect x="5" y="8" width="30" height="24" rx="2" ${st}/><path d="M5 28l9-8 7 6 5-4 9 8" ${st}/>`,
      'tmap-q': `<rect x="3" y="11" width="34" height="18" rx="3" fill="#2E9A63"/><text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Geist">?</text>`,
      'tmap-a': `<rect x="3" y="11" width="34" height="18" rx="3" fill="#2650E0"/><path d="M17 15v10l8-5z" fill="#fff"/>`,
      'tmap-d': `<path d="M5 9h30v17l-5 5H5z" fill="#FCE38A" stroke="#B07A00" stroke-width="1"/>`,
      'tmap-l': `<rect x="3" y="11" width="34" height="18" rx="3" fill="#0E1726"/><path d="M12 20h16" stroke="#fff" stroke-width="2"/>`,
      phase: `<circle cx="20" cy="20" r="13" fill="#2650E0"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Geist Mono">D</text>`,
      pstep: `<path d="M8 6h14M8 10h10" stroke="currentColor" stroke-width="1.4"/><rect x="5" y="14" width="30" height="12" rx="2" fill="#E8EEFC" stroke="#2650E0" stroke-width="1.4"/><rect x="5" y="29" width="5" height="4" fill="#2650E0"/><path d="M13 31h14" stroke="currentColor" stroke-width="1.4"/>`,
      card: `<rect x="5" y="5" width="30" height="30" rx="3" ${st}/><path d="M5 12h30" ${st}/><rect x="9" y="16" width="22" height="15" rx="1" fill="none" stroke="#C0362C" stroke-dasharray="2 2"/>`,
      'gb-step': `<path d="M12 6h16M14 9h12" stroke="currentColor" stroke-width="1.2"/><rect x="6" y="13" width="28" height="14" rx="1" fill="#C8F2C2" stroke="#3A8A3A" stroke-width="1.3"/><path d="M11 31h18M13 34h14" stroke="currentColor" stroke-width="1.2"/>`,
      'gb-comp': `<rect x="7" y="3" width="26" height="34" fill="#fff" stroke="#4A4A4A"/><rect x="10" y="6" width="20" height="6" fill="none" stroke="#D23F3F" stroke-dasharray="2 1.5"/><rect x="10" y="20" width="20" height="5" fill="#D9DCE1" stroke="#3C3C3C" stroke-width=".8"/><rect x="10" y="27" width="20" height="7" fill="none" stroke="#9A9A9A" stroke-dasharray="2 1.5"/>`,
      'gb-crit': `<rect x="5" y="7" width="30" height="7" fill="#D9DCE1" stroke="#3C3C3C" stroke-width=".8"/><rect x="5" y="17" width="30" height="16" fill="none" stroke="#9A9A9A" stroke-dasharray="2 1.5"/><path d="M8 22h18M8 27h14" stroke="currentColor"/>`,
      'gb-legend': `<rect x="5" y="8" width="30" height="10" fill="#F7963A" stroke="#3C3C3C" stroke-width=".8"/><rect x="5" y="21" width="30" height="12" fill="none" stroke="#9A9A9A" stroke-dasharray="2 1.5"/><path d="M8 25h12" stroke="#8A8A8A"/><path d="M8 30h12" stroke="#D23F3F"/>`,
      'gb-panel': `<rect x="3" y="7" width="34" height="26" fill="#CDD3DB" stroke="#8A939E"/><rect x="5" y="9" width="16" height="5" fill="#0E1116"/><rect x="7" y="19" width="7" height="6" fill="#C8F2C2" stroke="#3A8A3A" stroke-width=".8"/><rect x="18" y="19" width="7" height="6" fill="#C8F2C2" stroke="#3A8A3A" stroke-width=".8"/><rect x="29" y="19" width="6" height="6" fill="#4F8FE8"/>`,
      kaizen: `<path d="M20 4l3 8 8-4-3 8 8 4-8 3 4 8-8-3-4 8-3-8-8 4 3-8-8-3 8-4-3-8 8 4z" fill="#FCE6D8" stroke="#B5470B" stroke-width="1.2"/>`,
      'vsm-proc': `<rect x="7" y="5" width="26" height="10" ${st}/><rect x="7" y="17" width="26" height="18" ${st}/><path d="M10 23h20M10 29h20" stroke="currentColor" stroke-width="1"/>`,
      'vsm-inv': `<path d="M20 7l14 25H6z" fill="#FBF1D9" stroke="#B07A00" stroke-width="1.4"/><text x="20" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#7A5400">I</text>`,
      'vsm-ext': `<path d="M4 32V18l10-7v7l10-7v7l10-7v21z" ${st}/>`,
      'vsm-time': `<path d="M3 14h7v12h8V14h7v12h8V14h4" ${st}/>`,
      chart: `<path d="M6 6v28h28" ${st}/><path d="M9 26l6-8 5 4 6-10 6 5" fill="none" stroke="#2650E0" stroke-width="1.8"/><path d="M8 12h26" stroke="#C0362C" stroke-dasharray="2 2"/>`,
    };
    if (special[type]) return `<svg viewBox="0 0 40 40">${special[type]}</svg>`;
    const w = 34, h = type === 'decision' || type === 'ellipse' || type === 'triangle' || type === 'database' || type === 'offpage' ? 28 : 22;
    return `<svg viewBox="0 0 40 40"><g transform="translate(${(40 - w) / 2} ${(40 - h) / 2})"><path d="${d.preview(w, h)}" ${st}/></g></svg>`;
  };

  SH.LIBRARY = [
    { name: 'Thought process map', items: ['tmap-q', 'tmap-a', 'tmap-d', 'tmap-l', 'phase', 'frame', 'image', 'chart'] },
    { name: 'Process map', items: ['gb-step', ['process', { text: 'Decision?', fill: '#4F8FE8', stroke: '#1F4E99', color: '#0E1726', w: 120, h: 70 }, 'Decision (GB)'], ['process', { text: 'Repeat for next sample', fill: '#CDBB8E', stroke: '#5B4A1F', color: '#0E1726', w: 120, h: 80 }, 'Loop back (GB)'], 'gb-panel', 'pstep', 'process', 'decision', 'terminator', 'lane', 'kaizen'] },
    { name: 'Product map', items: ['gb-comp', 'gb-crit', 'gb-legend', ['rect', { text: 'PRODUCT MAP - V1 (BEFORE CHANGES)', fill: '#57C35F', stroke: '#2D2D2D', color: '#0E1726', bold: true, fs: 20, w: 1100, h: 44, sw: 1 }, 'Section header'], ['rect', { text: 'PRODUCT MAP - UNDERSTANDING THE PRODUCT', fill: '#CBF0C9', stroke: '#7BC67B', color: '#0E1726', bold: true, fs: 16, w: 1100, h: 32, sw: 1 }, 'Map title'], 'card', 'image', 'frame', 'sticky'] },
    { name: 'Value stream', items: ['vsm-ext', 'vsm-proc', 'vsm-inv', 'kaizen', 'vsm-time'] },
    { name: 'Flowchart', items: ['process', 'decision', 'terminator', 'data', 'document', 'predefined', 'database', 'manual', 'delay', 'hexagon', 'offpage'] },
    { name: 'Basic', items: ['text', 'sticky', 'rect', 'round', 'ellipse', 'triangle', 'frame', 'lane'] },
    { name: 'Live analysis', items: [['chart', { chart: 'imr', title: 'I-MR chart' }, 'I-MR'], ['chart', { chart: 'pareto', title: 'Pareto', labels: [], values: [] }, 'Pareto'], ['chart', { chart: 'cap', title: 'Capability', values: [] }, 'Capability'], ['chart', { chart: 'run', title: 'Run chart', values: [] }, 'Run chart']] },
  ];

  /* ---------- Templates de página ---------- */
  FL.templates = {
    LIST: [
      { k: 'blank', name: 'Blank canvas', phase: 'D', type: 'canvas', desc: 'Free-form diagram with the full shape library.' },
      { k: 'gb-pmap', name: 'Process Map Maker (GB standard)', phase: 'M', type: 'canvas', maker: 'process', desc: 'Fill in the steps, y’s and x’s — the map is drawn in the Whirlpool GB layout, critical x’s included.' },
      { k: 'gb-product', name: 'Product Map Maker (GB standard)', phase: 'M', type: 'canvas', maker: 'product', desc: 'List components, functions and characteristics — numbered y/x cards around the assembly, with V2 and critical x’s.' },
      { k: 'tmap', name: 'Thought process map (TMAP)', phase: 'D', type: 'canvas', desc: 'Questions → tools → findings → decisions. The project storyline.' },
      { k: 'pmap', name: 'Process map (PMAP)', phase: 'M', type: 'canvas', desc: 'Steps with outputs (Y) and inputs (X) classified C / N / SOP.' },
      { k: 'product', name: 'Product map', phase: 'M', type: 'canvas', desc: 'Assembly + components with characteristics (CTQ / X).' },
      { k: 'vsm', name: 'Value stream map', phase: 'M', type: 'canvas', desc: 'Process + inventory boxes with automatic lead-time ladder and PCE.' },
      { k: 'swimlane', name: 'Swimlane flowchart', phase: 'M', type: 'canvas', desc: 'Cross-functional flow by role.' },
      { k: 'spc', name: 'SPC study (I-MR + capability)', phase: 'M', type: 'canvas', desc: 'Paste a data column and get I-MR, Cp/Cpk instantly.' },
      { k: 'sipoc', name: 'SIPOC', phase: 'D', type: 'sipoc', desc: 'Suppliers, inputs, process, outputs, customers.' },
      { k: 'fishbone', name: 'Fishbone (Ishikawa)', phase: 'A', type: 'fishbone', desc: '6M cause & effect, flag suspects and validated root causes.' },
      { k: 'fmea', name: 'FMEA', phase: 'A', type: 'fmea', desc: 'Failure modes ranked by RPN, actions become plan tasks.' },
    ],
    build(k) {
      const C = (t, x, y, e) => SH.create(t, x, y, e); const E = (a, b, o = {}) => ({ id: U.uid('e'), a: a.id, b: b.id, as: null, bs: null, text: '', arrow: 'end', dash: false, ...o });
      const out = { shapes: [], edges: [], view: { x: 80, y: 60, z: 1 }, rules: [] };
      if (k === 'gb-pmap') return FL.makers.buildProcess(FL.makers.SAMPLE_PROCESS);
      if (k === 'gb-product') return FL.makers.buildProduct(FL.makers.SAMPLE_PRODUCT);
      if (k === 'tmap') {
        const m = C('phase', 0, 18, { text: 'D' }), q = C('tmap-q', 70, 0, { text: 'What exactly is the problem we need to solve?' }), a = C('tmap-a', 70, 130, { text: 'Tool used (e.g. Pareto of field data)' }), f = C('frame', 420, 100, { text: 'Evidence', w: 420, h: 260 }), d = C('tmap-d', 70, 260, { text: 'Finding / decision' }), q2 = C('tmap-q', 70, 400, { text: 'Next question?' });
        out.shapes.push(f, m, q, a, d, q2); out.edges.push(E(m, q, { arrow: 'none', dash: true }), E(q, a), E(a, f), E(a, d), E(d, q2));
      } else if (k === 'pmap') {
        let prev = null; ['Step 1', 'Step 2', 'Step 3', 'Step 4'].forEach((t, i) => { const s = C('pstep', i * 290, 0, { text: t, outputs: ['Output (Y)'], inputs: [{ t: 'Controllable input', c: 'C' }, { t: 'Noise', c: 'N' }, { t: 'Procedure', c: 'S' }] }); out.shapes.push(s); if (prev) out.edges.push(E(prev, s)); prev = s; });
      } else if (k === 'product') {
        const core = C('card', 360, 220, { text: 'Assembly', items: [{ t: 'Customer CTQ', tag: 'CTQ' }] }); out.shapes.push(C('frame', -40, -40, { text: 'PRODUCT MAP', w: 1060, h: 620 }), core);
        [[0, 20], [720, 20], [0, 380], [720, 380]].forEach(([x, y], i) => { const c = C('card', x, y, { text: `Component ${i + 1}`, items: [{ t: 'Characteristic', tag: 'X' }] }); out.shapes.push(c); out.edges.push(E(c, core, { arrow: 'none' })); });
      } else if (k === 'vsm') {
        const sup = C('vsm-ext', 0, 0, { text: 'Supplier' }), cus = C('vsm-ext', 1060, 0, { text: 'Customer' }); out.shapes.push(sup, cus); let prev = sup;
        [0, 1, 2].forEach((i) => { const inv = C('vsm-inv', 80 + i * 320, 200), p = C('vsm-proc', 190 + i * 320, 160, { text: `Process ${i + 1}` }); out.shapes.push(inv, p); out.edges.push(E(prev, inv, { dash: true }), E(inv, p, { dash: true })); prev = p; });
        out.edges.push(E(prev, cus, { dash: true })); out.shapes.push(C('vsm-time', 80, 420, { w: 1100 }));
        out.view.z = 0.8;
      } else if (k === 'swimlane') {
        ['Operator', 'Supervisor', 'Quality'].forEach((l, i) => out.shapes.push(C('lane', 0, i * 150, { text: l })));
        const a = C('terminator', 160, 45, { text: 'Start' }), b = C('process', 380, 190, { text: 'Do something' }), c = C('decision', 600, 330, { text: 'OK?' });
        out.shapes.push(a, b, c); out.edges.push(E(a, b), E(b, c));
      } else if (k === 'spc') {
        out.shapes.push(C('chart', 0, 0, { chart: 'imr', title: 'I-MR chart', values: [], w: 700, h: 400 }), C('chart', 740, 0, { chart: 'cap', title: 'Capability', values: [], w: 520, h: 400 }), C('sticky', 0, 430, { text: 'Paste a column of numbers from Excel or Minitab onto the canvas (Ctrl+V) — or select a chart and paste in the Data box.', w: 360, h: 120 }));
      }
      return out;
    },
  };
})(window.FL);

  <script>
/* Flowline · editor de mapas (estilo Lucidchart) + páginas da aba "Maps & analysis".
   SVG com reconciliação por id, pan/zoom, seleção, guias inteligentes, conectores ortogonais,
   containers, colar imagem/dados, regras de formatação condicional e vínculo forma ↔ tarefa. */
(function (FL) {
  const U = FL.util, D = U.date, S = FL.store, K = FL.kit, SH = FL.shapes;
  const MP = (FL.maps = {});
  const PAGE_ICON = { canvas: 'flow', sipoc: 'sipoc', fishbone: 'fish', fmea: 'table' };
  const GRID = 8;
  let E = null;

  /* ---------- Cores do tema (resolvidas, para SVG exportável) ---------- */
  const colors = () => {
    const cs = getComputedStyle(document.documentElement); const v = (n) => cs.getPropertyValue(n).trim();
    return { ink9: v('--c-ink-900'), ink7: v('--c-ink-700'), ink5: v('--c-ink-500'), line: v('--c-line'), lineStrong: v('--c-line-strong'), surface: v('--c-surface'), surface2: v('--c-surface-2'), surface3: v('--c-surface-3'), action: v('--c-action'), error: v('--c-error'), attention: v('--c-attention'), done: v('--c-done'), delta: v('--c-delta-up'), series2: v('--c-series-2'), board: v('--c-board'), sel: v('--c-sel'), guide: v('--c-guide') };
  };

  /* ================================================================
     Montagem
     ================================================================ */
  MP.render = (host, p, r) => {
    const prefs = (S.state.prefs.canvas = S.state.prefs.canvas || { lib: true, props: true, grid: true, snap: true, mini: true });
    E = { host, p, prefs, page: null, sel: new Set(), selEdge: null, hover: null, cache: new Map(), tool: 'select', col: colors(), guides: [], drag: null, space: false, clipboard: null };
    host.innerHTML = `
      <div class="cv">
        <aside class="lib" aria-label="Shape library"></aside>
        <div class="stage" tabindex="0">
          <svg class="world" xmlns="http://www.w3.org/2000/svg">
            <defs><pattern id="fl-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" style="fill:var(--c-grid-dot)"/></pattern></defs>
            <rect class="bg" x="0" y="0" width="100%" height="100%" fill="url(#fl-dots)"/>
            <g class="vp"><g class="L-cont"></g><g class="L-edges"></g><g class="L-shapes"></g><g class="L-over"></g></g>
          </svg>
          <div class="ctool"></div>
          <div class="zoombox"><button class="ib" data-z="out" aria-label="Zoom out">${U.ic('minus')}</button><span class="z" data-z="reset" title="Reset to 100%">100%</span><button class="ib" data-z="in" aria-label="Zoom in">${U.ic('plus')}</button><button class="ib" data-z="fit" aria-label="Fit to content" title="Fit (Shift+1)">${U.ic('fit')}</button></div>
          <div class="minimap" title="Click to navigate"></div>

        <nav class="pages" aria-label="Pages"></nav>
      </div>`;
    E.cv = U.$('.cv', host); E.stage = U.$('.stage', host); E.svg = U.$('svg.world', host); E.vp = U.$('.vp', host);
    E.Lc = U.$('.L-cont', host); E.Le = U.$('.L-edges', host); E.Ls = U.$('.L-shapes', host); E.Lo = U.$('.L-over', host);
    E.props = U.$('.props', host); E.lib = U.$('.lib', host); E.toolEl = U.$('.tool', host); E.pagesEl = U.$('.pages', host); E.mini = U.$('.minimap', host);
    drawLib(); drawToolbar(); wireStage(); wireZoombox();
    const onKey = (e) => keydown(e); const onUp = (e) => { if (e.code === 'Space') { E.space = false; E.stage.classList.remove('pan'); } };
    const onPaste = (e) => paste(e); const onCopy = (e) => copy(e, false); const onCut = (e) => copy(e, true);
    document.addEventListener('keydown', onKey); document.addEventListener('keyup', onUp);
    document.addEventListener('paste', onPaste); document.addEventListener('copy', onCopy); document.addEventListener('cut', onCut);
    const ro = new ResizeObserver(() => E && E.page && E.page.type === 'canvas' && drawMinimap()); ro.observe(E.stage);
    const offTheme = S.on((evt) => { if (evt === 'theme' && E) { E.col = colors(); E.cache.clear(); renderAll(); } });
    MP.switchPage(r.sub || p.activePage || (p.pages[0] && p.pages[0].id));
    return () => {
      document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onUp);
      document.removeEventListener('paste', onPaste); document.removeEventListener('copy', onCopy); document.removeEventListener('cut', onCut);
      ro.disconnect(); offTheme(); closeTextEdit(true); if (E && E.toolCleanup) E.toolCleanup(); E = null;
    };
  };

  MP.switchPage = (id) => {
    if (!E) return;

    closeTextEdit(true);
    if (E.toolCleanup) { E.toolCleanup(); E.toolCleanup = null; }
    const p = E.p;
    let page = S.page(p, id) || p.pages[0] || null;
    E.page = page; E.sel.clear(); E.selEdge = null; E.cache.clear(); E.hover = null;
    E.Lc.innerHTML = E.Ls.innerHTML = E.Le.innerHTML = E.Lo.innerHTML = '';
    if (page && p.activePage !== page.id) { p.activePage = page.id; S.save(); }

    if (!page) {
      E.cv.className = 'cv toolmode'; E.toolEl.hidden = false;
      E.toolEl.innerHTML = `<div class="empty" style="padding-top:12vh"><b>No maps yet</b><span>Start with a thought process map, a SIPOC or any template.</span><button class="btn btn-p" data-new>${U.ic('plus')}Add a page</button></div>`;

    } else {

      const api = { save: () => { S.touch(p); }, record: () => S.record('page:' + page.id, JSON.stringify(page.data)), project: p, page, log: (t) => S.log(p, t), redrawRec: () => FL.project.redrawRec() };

  };

  MP.focusShape = (id) => {
    if (!E) return;
    let page = E.page;
    if (!page || !page.data.shapes || !page.data.shapes.find((s) => s.id === id)) {
      const g = E.p.pages.find((x) => x.type === 'canvas' && x.data.shapes.some((s) => s.id === id));
      if (!g) { // linha de FMEA / causa do fishbone
        const t = E.p.pages.find((x) => x.type !== 'canvas' && JSON.stringify(x.data).includes(id)); if (!t) return;
        if (!E.page || E.page.id !== t.id) FL.shell.go(`#/p/${E.p.id}/maps/${t.id}`);
        setTimeout(() => { const el = E && U.$(`[data-rowid="${id}"]`, E.toolEl); if (el) { el.scrollIntoView({ block: 'center' }); el.animate([{ background: 'var(--c-attention-soft)' }, { background: 'transparent' }], { duration: 1600 }); } }, 60);
        return;

    }

    if (!E.page || E.page.id !== page.id) MP.switchPage(page.id);
    const v = page.data.view; const W = E.stage.clientWidth, H = E.stage.clientHeight;
    v.z = Math.max(v.z, 0.9); v.x = W / 2 - (s.x + s.w / 2) * v.z; v.y = H / 2 - (s.y + s.h / 2) * v.z;
    E.sel = new Set([id]); E.selEdge = null; renderAll(); drawProps();
    const ring = `<rect x="${s.x - 8}" y="${s.y - 8}" width="${s.w + 16}" height="${s.h + 16}" rx="10" fill="none" stroke="${E.col.attention}" stroke-width="${4 / v.z}"><animate attributeName="opacity" values="1;0;1;0;1;0" dur="1.6s" fill="freeze"/></rect>`;
    E.Lo.insertAdjacentHTML('beforeend', ring);
  };

  /* ================================================================
     Páginas (barra inferior, como o Lucid)
     ================================================================ */
  function drawPages() {
    const p = E.p;
    E.pagesEl.innerHTML = p.pages.map((g) => `<button class="pg${E.page && g.id === E.page.id ? ' on' : ''}" data-pg="${g.id}" title="${U.esc(g.name)} · ${FL.phase(g.phase).name}"><span class="ph-tag" style="background:${FL.phase(g.phase).color}">${g.phase}</span>${U.ic(PAGE_ICON[g.type], 14)}${U.esc(g.name)}</button>`).join('') +
      `<button class="pg-add" data-add>${U.ic('plus')}Add page</button>`;
    U.$$('[data-pg]', E.pagesEl).forEach((b) => {
      b.onclick = () => { if (!E.page || b.dataset.pg !== E.page.id) FL.shell.go(`#/p/${p.id}/maps/${b.dataset.pg}`); };
      b.ondblclick = () => renamePage(S.page(p, b.dataset.pg));
      b.oncontextmenu = (e) => { e.preventDefault(); pageMenu(e, S.page(p, b.dataset.pg)); };
    });

  }
  function renamePage(g) { K.prompt('Rename page', 'Page name', g.name, (v) => { if (v) { g.name = v; S.touch(E.p); drawPages(); } }); }
  function pageMenu(e, g) {
    const p = E.p; const i = p.pages.indexOf(g);

      { header: 'DMAIC phase' },
      ...FL.PHASES.map((ph) => ({ label: ph.name, check: g.phase === ph.k, onClick: () => { g.phase = ph.k; S.touch(p); drawPages(); } })),
      '-',
      { label: 'Move left', icon: 'chevL', onClick: () => { if (i > 0) { p.pages.splice(i - 1, 0, p.pages.splice(i, 1)[0]); S.touch(p); drawPages(); } } },
      { label: 'Move right', icon: 'chevR', onClick: () => { if (i < p.pages.length - 1) { p.pages.splice(i + 1, 0, p.pages.splice(i, 1)[0]); S.touch(p); drawPages(); } } },
      '-',
      { label: 'Delete page', icon: 'trash', danger: true, onClick: () => K.confirm('Delete page?', `“${g.name}” will be removed from this project.`, () => {
        p.pages.splice(i, 1); S.log(p, `deleted page “${g.name}”`); S.touch(p);
        p.tasks.forEach((t) => { if (t.link && t.link.pageId === g.id) t.link = null; });
        const nx = p.pages[Math.max(0, i - 1)]; FL.shell.go(`#/p/${p.id}/maps${nx ? '/' + nx.id : ''}`); if (!nx) MP.switchPage(null);
      }, { danger: true, ok: 'Delete' }) },
    ]);
  }
  function remapIds(data) {
    const map = {}; data.shapes.forEach((s) => { map[s.id] = s.id = U.uid('s'); delete s.taskId; });
    data.edges.forEach((e) => { e.id = U.uid('e'); e.a = map[e.a]; e.b = map[e.b]; });
  }
  function newPageMenu(anchor) {

      p.pages.push(g); S.log(p, `added page “${g.name}”`); S.touch(p); FL.shell.go(`#/p/${p.id}/maps/${g.id}`);
    };
    const r = anchor.getBoundingClientRect();
    K.menu(r.left, r.top - 8, [{ header: 'Canvas templates' }, ...FL.templates.LIST.filter((t) => t.type === 'canvas').map((t) => ({ label: t.name, icon: 'flow', kbd: t.phase, onClick: () => add(t) })), { header: 'Structured tools' }, ...FL.templates.LIST.filter((t) => t.type !== 'canvas').map((t) => ({ label: t.name, icon: PAGE_ICON[t.type], kbd: t.phase, onClick: () => add(t) }))], { flipGap: 0 });
    const m = U.$('.menu'); if (m) { const h = m.getBoundingClientRect().height; m.style.top = Math.max(8, r.top - h - 6) + 'px'; }
  }

  /* ================================================================

     ================================================================ */
  function drawLib() {
    const closed = (S.state.prefs.libClosed = S.state.prefs.libClosed || {});
    E.lib.innerHTML = `<div class="lib-s"><input class="inp inp-sm" placeholder="Search shapes" data-q></div>` + SH.LIBRARY.map((g) => `
      <div class="lib-g${closed[g.name] ? ' closed' : ''}" data-g="${g.name}"><div class="lib-gh">${U.esc(g.name)}<span class="chev">${U.ic('chev', 14)}</span></div>
      <div class="lib-items">${g.items.map((it) => { const [type, extra, label] = Array.isArray(it) ? it : [it, null, null]; return label
        ? `<button class="lib-it lib-wide" draggable="true" data-type="${type}" data-extra='${U.esc(JSON.stringify(extra))}' title="${U.esc(label)}">${SH.preview(type).replace('<svg ', '<svg style="width:26px;height:26px" ')}<span>${U.esc(label)}</span></button>`
        : `<button class="lib-it" draggable="true" data-type="${type}" title="${U.esc(SH.def(type).name)}">${SH.preview(type)}</button>`; }).join('')}</div></div>`).join('');
    U.$$('.lib-gh', E.lib).forEach((h) => (h.onclick = () => { const g = h.parentElement; g.classList.toggle('closed'); closed[g.dataset.g] = g.classList.contains('closed'); S.save(); }));
    U.$$('.lib-it', E.lib).forEach((b) => {
      const extra = () => (b.dataset.extra ? JSON.parse(b.dataset.extra) : {});
      b.addEventListener('dragstart', (e) => { e.dataTransfer.setData('application/x-fl-shape', JSON.stringify({ type: b.dataset.type, extra: extra() })); e.dataTransfer.effectAllowed = 'copy'; });
      b.onclick = () => { const v = E.page.data.view; const c = { x: (E.stage.clientWidth / 2 - v.x) / v.z, y: (E.stage.clientHeight / 2 - v.y) / v.z }; addShape(b.dataset.type, c.x, c.y, extra(), true); };
    });
    E.lib.querySelector('[data-q]').oninput = (e) => {
      const q = e.target.value.toLowerCase();
      U.$$('.lib-it', E.lib).forEach((b) => { b.style.display = !q || (SH.def(b.dataset.type).name + ' ' + (b.title || '')).toLowerCase().includes(q) ? '' : 'none'; });
      U.$$('.lib-g', E.lib).forEach((g) => q && g.classList.remove('closed'));
    };
  }

  function drawToolbar() {
    const t = U.$('.ctool', E.stage);
    t.innerHTML = `
      <button class="ib${E.tool === 'select' ? ' on' : ''}" data-t="select" title="Select (V)">${U.ic('pointer')}</button>
      <button class="ib${E.tool === 'hand' ? ' on' : ''}" data-t="hand" title="Pan (H or hold Space)">${U.ic('hand')}</button>
      <span class="sep"></span>
      <button class="ib" data-add="text" title="Text (T)">${U.ic('text')}</button>
      <button class="ib" data-add="sticky" title="Sticky note (N)">${U.ic('sticky')}</button>
      <button class="ib" data-add="frame" title="Frame (F)">${U.ic('frame')}</button>
      <button class="ib" data-add="tmap-q" title="TMAP question (Q)">${U.ic('brain')}</button>
      <button class="ib" data-img title="Insert image">${U.ic('image')}</button>
      <button class="ib" data-add="chart" title="Live chart">${U.ic('chart')}</button>
      <span class="sep"></span>
      <button class="ib" data-a="undo" title="Undo (Ctrl+Z)">${U.ic('undo')}</button>
      <button class="ib" data-a="redo" title="Redo (Ctrl+Y)">${U.ic('redo')}</button>
      <span class="sep"></span>
      <button class="ib${E.prefs.lib ? ' on' : ''}" data-a="lib" title="Shape library">${U.ic('grid')}</button>
      <button class="ib${E.prefs.props ? ' on' : ''}" data-a="props" title="Properties panel">${U.ic('layers')}</button>
      <button class="ib" data-a="export" title="Export">${U.ic('download')}</button>`;
    U.$$('[data-t]', t).forEach((b) => (b.onclick = () => setTool(b.dataset.t)));
    U.$$('[data-add]', t).forEach((b) => (b.onclick = () => addAtCenter(b.dataset.add)));
    t.querySelector('[data-img]').onclick = pickImage;
    t.querySelector('[data-a=undo]').onclick = () => undo(false);
    t.querySelector('[data-a=redo]').onclick = () => undo(true);

      { label: E.prefs.mini ? 'Hide minimap' : 'Show minimap', icon: 'eye', onClick: () => { E.prefs.mini = !E.prefs.mini; S.save(); E.mini.style.display = E.prefs.mini ? '' : 'none'; drawMinimap(); } },
      { label: E.prefs.grid ? 'Hide dot grid' : 'Show dot grid', icon: 'grid', onClick: () => { E.prefs.grid = !E.prefs.grid; S.save(); applyView(); } },
      { label: E.prefs.snap ? 'Turn snapping off' : 'Turn snapping on', icon: 'target', onClick: () => { E.prefs.snap = !E.prefs.snap; S.save(); } },
    ], { alignRight: true });
  }
  function setTool(t) { E.tool = t; E.stage.classList.toggle('pan', t === 'hand'); drawToolbar(); }

  /* ================================================================
     Render
     ================================================================ */
  const key = () => 'page:' + E.page.id;
  const RO = () => !S.canEdit(E.p);
  const roToast = () => K.toast(FL.t('You have view-only access to this project'));
  const data = () => E.page.data;
  const byId = (id) => data().shapes.find((s) => s.id === id);

  function applyView() {
    const v = data().view;
    E.vp.setAttribute('transform', `translate(${v.x} ${v.y}) scale(${v.z})`);
    const pat = U.$('#fl-dots', E.svg); const sz = 24;
    pat.setAttribute('patternTransform', `translate(${v.x} ${v.y}) scale(${v.z})`); pat.setAttribute('width', sz); pat.setAttribute('height', sz);
    U.$('.bg', E.svg).style.display = E.prefs.grid && v.z > 0.35 ? '' : 'none';
    const zl = U.$('.zoombox .z', E.stage); if (zl) zl.textContent = Math.round(v.z * 100) + '%';
  }

  function renderAll() { if (!E || !E.page || E.page.type !== 'canvas') return; applyView(); renderShapes(); renderEdges(); renderOverlay(); drawMinimap(); }

  /** Cor vinda de regras de formatação condicional (equivalente ao conditional formatting do Lucid). */
  function ruleFill(s) {
    const rules = data().rules || []; const d = s.data || {};
    for (const r of rules) {
      if (!(r.field in d)) continue;
      const a = parseFloat(String(d[r.field]).replace(',', '.')), b = parseFloat(String(r.value).replace(',', '.'));
      const ok = isNaN(a) || isNaN(b) ? (r.op === '=' ? String(d[r.field]) === String(r.value) : r.op === '≠' ? String(d[r.field]) !== String(r.value) : false)
        : { '>': a > b, '<': a < b, '≥': a >= b, '≤': a <= b, '=': a === b, '≠': a !== b }[r.op];
      if (ok) return r.fill;
    }
    return null;
  }
  function taskOf(s) { return s.taskId ? E.p.tasks.find((t) => t.id === s.taskId) : null; }

  function shapeSVG(s, col, page) {
    const def = SH.def(s.type);
    if (s.img && !S.assets[s.img] && E && E.p) S.ensureAsset(E.p.id, s.img).then((src) => { if (src && E) { E.cache.delete(s.id); renderShapes(); } });
    if (def.autoH) { const h = def.autoH(s, page); if (Math.abs(h - s.h) > 0.5) s.h = h; }
    const rf = ruleFill(s); let view = rf ? { ...s, fill: rf } : s;
    if (E && E.text && E.text.id === s.id) view = { ...view, text: '' }; // texto em edição é desenhado pelo textarea
    let out = def.render(view, col, page);
    const t = taskOf(s);
    if (t) {
      const st = FL.status(t.status); const label = `${t.status === 'Done' ? '✓ Done' : t.status} · ${D.short(t.end)}`;
      const w = U.measure(label, 10.5, 600) + 22;
      out += `<g class="badge" data-badge="${s.id}" style="cursor:pointer" transform="translate(${s.w - w + 6} -11)"><rect width="${w}" height="20" rx="10" fill="${st.color}" stroke="${col.surface}" stroke-width="2"/><circle cx="10" cy="10" r="3" fill="#fff"/><text x="17" y="14" font-size="10.5" font-weight="600" fill="#fff" font-family="Geist">${U.esc(label)}</text></g>`;
    }
    if (s.locked) out += `<g transform="translate(-8 -8)" opacity=".7"><circle cx="8" cy="8" r="8" fill="${col.surface}" stroke="${col.line}"/><path d="M5 8h6v5H5zM6 8V6.5a2 2 0 0 1 4 0V8" fill="none" stroke="${col.ink5}" stroke-width="1.2"/></g>`;
    return out;
  }

  function renderShapes() {
    const col = E.col; const page = E.page; const seen = new Set();
    const shapes = data().shapes;
    const orderC = [], orderS = [];
    shapes.forEach((s) => (SH.isContainer(s) ? orderC : orderS).push(s));
    const t = (s) => { const tk = taskOf(s); return tk ? tk.status + tk.end : ''; };
    const place = (s, layer) => {

  async function paste(e) {
    if (!E || !E.page || E.page.type !== 'canvas' || E.text) return;
    if (RO()) return;
    const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
    if (document.querySelector('.scrim')) return;
    const v = data().view; const c = { x: (E.stage.clientWidth / 2 - v.x) / v.z, y: (E.stage.clientHeight / 2 - v.y) / v.z };
    const items = [...(e.clipboardData.items || [])];
    const img = items.find((i) => i.type.startsWith('image/'));
    if (img) {
      e.preventDefault();
      const one = E.sel.size === 1 ? byId([...E.sel][0]) : null; // foto colada com um cartão selecionado vai para dentro dele
      await addImageFile(img.getAsFile(), c.x, c.y, one && ['gb-comp', 'card', 'image'].includes(one.type) ? one.id : null); return;
    }
    const text = e.clipboardData.getData('text/plain'); if (!text) return;
    e.preventDefault();
    if (text.startsWith('flowline-shapes:')) { try { const clip = JSON.parse(text.slice(16)); const sel = selBox(); pasteShapes(clip, sel ? null : { x: c.x - 100, y: c.y - 60 }); } catch (_) { } return; }
    // números colados do Excel/Minitab → gráfico vivo (ou dados do gráfico selecionado)
    const parsed = FL.charts.parse(text);
    const selChart = E.sel.size === 1 && byId([...E.sel][0]).type === 'chart' ? byId([...E.sel][0]) : null;
    if (parsed.values.length >= 3) {
      if (selChart) { change(() => { selChart.values = parsed.values; if (parsed.labeled) selChart.labels = parsed.labels; }); K.toast(`${parsed.values.length} values loaded into the chart`); return; }
      const extra = parsed.labeled ? { chart: 'pareto', title: 'Pareto', labels: parsed.labels, values: parsed.values } : { chart: 'imr', title: 'I-MR chart', values: parsed.values };
      addShape('chart', c.x, c.y, extra, true); K.toast(parsed.labeled ? 'Pasted as a Pareto chart' : `Pasted ${parsed.values.length} values as an I-MR chart — change the type in the panel`);
      return;
    }

  }

    const t = { id: U.uid('t'), name, level: si >= 0 ? 1 : 0, phase: ph, owner: S.state.me, status: 'Not started', start: D.today(), end: null, dur: 3, pct: 0, preds: [], notes: `Created from “${E.page.name}”`, link: { pageId: E.page.id, shapeId: s.id }, collapsed: false };

    const outs = P.querySelector('[data-outs]'); if (outs) liveInput(outs, (v) => (s.outputs = v.split('\n').map((x) => x.trim()).filter(Boolean)));

    U.$$('[data-geo]', P).forEach((i) => (i.onchange = () => change(() => (s[i.dataset.geo] = Math.max(i.dataset.geo === 'w' || i.dataset.geo === 'h' ? 20 : -1e6, +i.value || 0)))));
    P.querySelector('[data-front]').onclick = () => change(() => { const a = data().shapes; a.push(a.splice(a.indexOf(s), 1)[0]); });
    P.querySelector('[data-back]').onclick = () => change(() => { const a = data().shapes; a.unshift(a.splice(a.indexOf(s), 1)[0]); });
    P.querySelector('[data-lock]').onclick = () => change(() => (s.locked = !s.locked));
    P.querySelector('[data-dup]').onclick = duplicate;
    P.querySelector('[data-del]').onclick = deleteSel;

  /* ================================================================
     Exportação (SVG / PNG) — só SVG puro, sem foreignObject
     ================================================================ */
  function exportImage(fmt) {
    const d = data(); if (!d.shapes.length) return K.toast('Nothing to export');
    const col = colors(); const pad = 40;
    const x1 = Math.min(...d.shapes.map((s) => s.x)) - pad, y1 = Math.min(...d.shapes.map((s) => s.y)) - pad - 12;
    const x2 = Math.max(...d.shapes.map((s) => s.x + s.w)) + pad, y2 = Math.max(...d.shapes.map((s) => s.y + s.h)) + pad + 20;
    const W = Math.ceil(x2 - x1), H = Math.ceil(y2 - y1);
    const body = [...d.shapes.filter((s) => SH.isContainer(s)), ...d.shapes.filter((s) => !SH.isContainer(s))];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${x1} ${y1} ${W} ${H}"><rect x="${x1}" y="${y1}" width="${W}" height="${H}" fill="${col.board}"/>

      ${body.filter((s) => !SH.isContainer(s)).map((s) => `<g transform="translate(${s.x} ${s.y})">${shapeSVG(s, col, E.page)}</g>`).join('')}</svg>`;
    const name = `${E.p.code}-${E.page.name.replace(/[^\w-]+/g, '_')}`;
    if (fmt === 'svg') { U.download(name + '.svg', svg, 'image/svg+xml'); return; }

    img.onerror = () => K.toast('PNG export failed — try SVG');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
})(window.FL);

  <script>
/* Flowline · SIPOC estruturado. A coluna P vira um mapa de processo com um clique. */
(function (FL) {
  const U = FL.util, K = FL.kit, S = FL.store;
  FL.tools = FL.tools || {};
  const COLS = [['S', 'Suppliers', 'Who provides the inputs'], ['I', 'Inputs', 'Materials, information, resources'], ['P', 'Process', '4–7 high-level steps'], ['O', 'Outputs', 'What the process produces'], ['C', 'Customers', 'Who receives the outputs']];

  FL.tools.sipoc = {
    render(host, page, p, api) {
      const d = page.data;
      const draw = (focus) => {
        host.innerHTML = `<div class="tool-in animate-in">
          <div class="ph"><div><h1 style="font-size:20px">${U.esc(page.name)}</h1><p>High-level view of the process in scope — agree on boundaries before mapping in detail.</p></div>
            <div class="right row"><span class="muted" style="font-size:13px">${d.P.length} process steps</span><button class="btn" data-gen ${d.P.length ? '' : 'disabled'}>${U.ic('flow')}Generate process map</button></div></div>
          <div class="sipoc">${COLS.map(([k, name, hint]) => `
            <div class="card sc ${k === 'P' ? 'p' : ''}"><div class="sch"><span class="L">${k}</span><div><b>${name}</b><span>${hint}</span></div></div>
              <ul>${d[k].map((t, i) => `<li><span class="n">${k === 'P' ? i + 1 + '.' : '•'}</span><span contenteditable="true" data-c="${k}" data-i="${i}">${U.esc(t)}</span><span class="x" data-del="${k}:${i}" title="Remove">${U.ic('x', 13)}</span></li>`).join('')}</ul>
              <button class="add" data-add="${k}">${FL.t({ S: 'Add supplier', I: 'Add input', P: 'Add step', O: 'Add output', C: 'Add customer' }[k])}</button></div>`).join('')}</div>
          <div class="card cblock" style="max-width:760px"><h4>${U.ic('sparkle', 14)}How to read it</h4><span class="muted" style="line-height:1.55">Start in the middle (P): name the first and last step to set the scope. Then list the outputs and who receives them, and finally the inputs and who supplies them. Keep each item short — details belong in the PMAP.</span></div>
        </div>`;
        U.$$('[contenteditable]', host).forEach((el) => {
          const k = el.dataset.c, i = +el.dataset.i; let rec = false;
          el.addEventListener('input', () => { if (!rec) { api.record(); rec = true; } d[k][i] = el.innerText.trim(); api.save(); });
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); api.record(); d[k].splice(i + 1, 0, ''); api.save(); draw({ k, i: i + 1 }); }
            if (e.key === 'Backspace' && !el.innerText.trim()) { e.preventDefault(); api.record(); d[k].splice(i, 1); api.save(); draw({ k, i: Math.max(0, i - 1) }); }
          });
          el.addEventListener('blur', () => { if (!el.innerText.trim() && d[k][i] === '') { d[k].splice(i, 1); api.save(); setTimeout(() => draw(), 0); } });
        });
        U.$$('[data-add]', host).forEach((b) => (b.onclick = () => { const k = b.dataset.add; api.record(); d[k].push(''); api.save(); draw({ k, i: d[k].length - 1 }); }));
        U.$$('[data-del]', host).forEach((b) => (b.onclick = () => { const [k, i] = b.dataset.del.split(':'); api.record(); d[k].splice(+i, 1); api.save(); draw(); }));
        host.querySelector('[data-gen]').onclick = () => {
          const steps = d.P.filter(Boolean);
          const data = { shapes: [], edges: [], view: { x: 60, y: 80, z: 0.9 }, rules: [] }; let prev = null;
          const T = FL.shapes.create('text', 0, -70, { text: `Process map · ${p.name}`, w: 700, align: 'left', fs: 18, bold: true }); data.shapes.push(T);
          steps.forEach((t, i) => {
            const s = FL.shapes.create('pstep', i * 290, 0, { text: t, outputs: i === steps.length - 1 ? d.O.slice(0, 3) : ['Output (Y)'], inputs: i === 0 ? d.I.slice(0, 3).map((x) => ({ t: x, c: 'C' })) : [{ t: 'Input (X)', c: 'C' }] });
            data.shapes.push(s); if (prev) data.edges.push({ id: U.uid('e'), a: prev.id, b: s.id, as: 'r', bs: 'l', text: '', arrow: 'end', dash: false }); prev = s;
          });
          const g = FL.newPage('canvas', 'Process map (from SIPOC)', 'M', { kind: 'pmap', data });
          p.pages.push(g); api.log(`generated a process map from ${page.name}`); api.save();
          FL.shell.go(`#/p/${p.id}/maps/${g.id}`); K.toast('Process map created from the P column');
        };
        if (focus) { const el = U.$(`[data-c="${focus.k}"][data-i="${focus.i}"]`, host); if (el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
      };
      draw();
    },
  };
})(window.FL);

  <script>
/* Flowline · Fishbone (Ishikawa) estruturado: o diagrama se desenha sozinho a partir da lista.
   Causas podem ser marcadas como suspeitas ou causa raiz validada, e virar ação no plano. */
(function (FL) {
  const U = FL.util, K = FL.kit, S = FL.store, D = U.date;
  FL.tools = FL.tools || {};

  function diagram(d, col) {
    const cats = d.cats; const n = cats.length; const top = Math.ceil(n / 2);
    const maxC = Math.max(2, ...cats.map((c) => c.causes.length));
    const bone = Math.max(150, (maxC + 1) * 26); const colW = 270; const headW = 220;
    const W = 60 + top * colW + headW + 40; const H = bone * 2 + 80; const sy = H / 2;
    let o = `<line x1="40" y1="${sy}" x2="${W - headW - 20}" y2="${sy}" stroke="${col.ink9}" stroke-width="3"/>`;
    o += `<path d="M${W - headW - 20} ${sy - 46}L${W - 40} ${sy - 46}L${W - 20} ${sy}L${W - 40} ${sy + 46}L${W - headW - 20} ${sy + 46}Z" fill="${col.action}"/>`;
    o += FL.shapes.text({ text: d.effect || 'Effect', fs: 14, bold: true }, { x: W - headW - 16, y: sy - 46, w: headW - 20, h: 92 }, col, { color: '#fff', pad: 10 });
    cats.forEach((c, i) => {
      const up = i < top; const k = up ? i : i - top; const x2 = 60 + (k + 1) * colW - 40; const x1 = x2 - bone * 0.55; const y1 = up ? sy - bone : sy + bone;
      o += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${sy}" stroke="${col.ink7}" stroke-width="2"/>`;
      o += `<rect x="${x1 - 70}" y="${up ? y1 - 30 : y1 + 4}" width="140" height="26" rx="6" fill="${col.ink9}"/><text x="${x1}" y="${up ? y1 - 12 : y1 + 22}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${col.surface}" font-family="Geist">${U.esc(c.name)}</text>`;
      c.causes.forEach((z, j) => {
        const t = (j + 1) / (c.causes.length + 1); const px = x1 + (x2 - x1) * t; const py = y1 + (sy - y1) * t;
        const clr = z.flag === 'root' ? col.error : z.flag === 'suspect' ? col.attention : col.ink5;
        const label = U.wrap(z.text || '…', 200, 11.5)[0] + (U.wrap(z.text || '', 200, 11.5).length > 1 ? '…' : '');
        const tw = Math.min(200, U.measure(label, 11.5, z.flag ? 600 : 400)) + 8;
        o += `<line x1="${px - tw}" y1="${py}" x2="${px}" y2="${py}" stroke="${clr}" stroke-width="${z.flag ? 1.8 : 1.2}"/><text x="${px - 4}" y="${py - 4}" text-anchor="end" font-size="11.5" font-weight="${z.flag ? 600 : 400}" fill="${z.flag ? clr : col.ink7}" font-family="Geist">${U.esc(label)}</text>`;
        if (z.flag === 'root') o += `<circle cx="${px}" cy="${py}" r="4" fill="${col.error}"/>`;
      });
    });
    return { svg: o, W, H };
  }

  FL.tools.fishbone = {
    render(host, page, p, api) {
      const d = page.data;
      const col = () => { const cs = getComputedStyle(document.documentElement); const v = (n) => cs.getPropertyValue(n).trim(); return { ink9: v('--c-ink-900'), ink7: v('--c-ink-700'), ink5: v('--c-ink-500'), action: v('--c-action'), error: v('--c-error'), attention: v('--c-attention'), surface: v('--c-surface') }; };
      const draw = (focusId) => {
        const all = d.cats.flatMap((c) => c.causes); const roots = all.filter((z) => z.flag === 'root').length, sus = all.filter((z) => z.flag === 'suspect').length;

(function (FL) {

  M.SAMPLE_PROCESS = {
    y: 'Torque to Strip',
    steps: [
      { name: 'Prepare materials on workbench', ys: ['All materials are prepared'], xs: [{ c: 'C', t: 'sheet with holes' }, { c: 'C', t: 'torque meter' }, { c: 'C', t: 'screws' }] },
      { name: 'Attach the opposite edge of the sheet to secure it', ys: ['Sheet secured from falling or shifting'], xs: [{ c: 'N', t: 'type of weight' }, { c: 'C', t: 'amount of weight' }, { c: 'C', t: 'placement of weight' }] },
